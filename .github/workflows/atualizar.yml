name: Atualizar canais.json

on:
  schedule:
    # Todo dia às 06:00 UTC (03:00 em Santa Maria-RS)
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install aiohttp

      - name: Rodar atualizador
        run: python atualizar_canais.py

      - name: Commitar canais.json se mudou
        run: |
          git config user.name "bolotatv-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- canais.json; then
            git add canais.json
            git commit -m "chore: atualizacao automatica da lista de canais"
            git push
          else
            echo "Nenhuma mudanca na lista de canais."
          fi
