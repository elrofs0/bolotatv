name: Atualizar Lista de Canais IPTV

on:
  schedule:
    # Roda automaticamente todos os dias às 03:00 UTC (00:00 no horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite que você clique em um botão para rodar o script manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dá permissão para a Action modificar e salvar arquivos no repositório

    steps:
    - name: Checkout do codigo atual
      uses: actions/checkout@v4

    - name: Configurar o ambiente Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'

    - name: Instalar as dependencias de rede
      run: |
        python -m pip install --upgrade pip
        pip install aiohttp

    - name: Executar o script de raspagem de canais
      run: python atualizar_canais.py

    - name: Verificar se houve alteracoes e salvar no GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add canais.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automação: Lista de canais atualizada via script" && git push)
