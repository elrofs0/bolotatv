<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ TERMINAL MAD MAX // BOLOTA TV v11.0 OMNI ]</title>
    
    <!-- Video.js Engine -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --hazard-orange: #ff5500;
            --terminal-green: #00ff66;
            --terminal-red: #ff3344;
            --terminal-grey: #666;
            --bg-dark: #070709;
            --panel-bg: #111217;
            --border-color: #2a1a08;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--bg-dark);
            color: var(--terminal-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 0, 0.05));
            background-size: 100% 3px, 6px 100%;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background-color: var(--panel-bg);
            border-bottom: 2px solid var(--hazard-orange);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.25);
        }

        .logo-box { display: flex; align-items: center; gap: 10px; color: var(--hazard-orange); font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }
        .sys-info { display: flex; gap: 15px; font-size: 0.8rem; background: #000; padding: 6px 14px; border: 1px solid var(--hazard-orange); color: var(--hazard-orange); }
        .sys-info span { display: flex; align-items: center; gap: 6px; }

        .main-container { display: grid; grid-template-columns: 1fr 420px; gap: 15px; padding: 15px; max-width: 1800px; margin: 0 auto; width: 100%; height: calc(100vh - 65px); }
        .player-section { display: flex; flex-direction: column; gap: 10px; }

        .screen-container {
            position: relative; width: 100%; height: 520px; background-color: #000;
            border: 2px solid var(--hazard-orange); box-shadow: inset 0 0 20px rgba(255, 85, 0, 0.3);
            border-radius: 4px; overflow: hidden;
        }

        #video-wrapper { width: 100%; height: 100%; }
        #vjs-player { width: 100%; height: 100%; }
        #yt-player { width: 100%; height: 100%; border: none; display: none; }

        .terminal-status { background-color: var(--panel-bg); padding: 12px; border: 1px solid var(--border-color); border-left: 4px solid var(--hazard-orange); }
        #now-playing { font-size: 0.9rem; color: var(--terminal-green); text-shadow: 0 0 5px rgba(0, 255, 102, 0.5); }

        .sidebar { background-color: var(--panel-bg); border: 1px solid var(--hazard-orange); display: flex; flex-direction: column; overflow: hidden; }
        .search-container { padding: 10px; border-bottom: 1px solid var(--border-color); background: #090a0d; }
        .search-container input { width: 100%; padding: 8px 12px; background: #000; border: 1px solid var(--terminal-green); color: var(--terminal-green); outline: none; }

        .categories-bar { display: flex; gap: 5px; padding: 8px; background: #000; border-bottom: 1px solid var(--border-color); overflow-x: auto; scrollbar-width: none; }
        .categories-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: #15161c; border: 1px solid #333; color: #888; padding: 5px 10px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .cat-btn:hover, .cat-btn.active { background: var(--hazard-orange); color: #000; border-color: var(--hazard-orange); font-weight: bold; }

        .diag-bar { padding: 8px; background: #000; border-bottom: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
        .diag-btn { background: #15161c; border: 1px solid var(--terminal-green); color: var(--terminal-green); padding: 6px 10px; font-size: 0.75rem; cursor: pointer; flex: 1; }
        .diag-btn:hover { background: var(--terminal-green); color: #000; }
        .diag-summary { font-size: 0.7rem; color: #888; white-space: nowrap; }

        .channel-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: var(--hazard-orange); }

        .channel-item { padding: 10px; background: #090a0d; border: 1px solid #1a1c24; color: #aaa; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; transition: all 0.15s ease; gap: 8px; }
        .channel-item:hover { border-color: var(--terminal-green); color: var(--terminal-green); background: #11141a; }
        .channel-item.active { border-color: var(--hazard-orange); background: rgba(255, 85, 0, 0.15); color: var(--hazard-orange); font-weight: bold; }

        .channel-name { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
        .status-dot { width: 9px; height: 9px; min-width: 9px; border-radius: 50%; background: var(--terminal-grey); }
        .status-dot.ok { background: var(--terminal-green); box-shadow: 0 0 6px var(--terminal-green); }
        .status-dot.yt { background: #ff0000; box-shadow: 0 0 6px #ff0000; } /* Indicador YT */
        .status-dot.fail { background: var(--terminal-red); }
        
        .badge-group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .badge { font-size: 0.6rem; padding: 2px 6px; border: 1px solid; text-transform: uppercase; font-weight: bold; }
        .badge-br { border-color: #00ff66; color: #00ff66; }
        .badge-intl { border-color: #00ccff; color: #00ccff; }
        .badge-type { border-color: #ffaa00; color: #ffaa00; }

        @media (max-width: 1000px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
            .screen-container { height: 280px; }
            .sidebar { height: 500px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box"><i class="fa-solid fa-satellite-dish"></i><span>TERMINAL MAD MAX // v11.0</span></div>
        <div class="sys-info">
            <span><i class="fa-solid fa-location-dot"></i> SANTA MARIA-RS</span>
            <span><i class="fa-solid fa-temperature-half"></i> <span id="temp-display">--°C</span></span>
            <span><i class="fa-solid fa-clock"></i> <span id="clock-display">00:00:00</span></span>
        </div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="screen-container">
                <!-- Wrapper HLS -->
                <div id="video-wrapper">
                    <video id="vjs-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
                </div>
                <!-- Wrapper YouTube -->
                <iframe id="yt-player" allow="autoplay; encrypted-media; fullscreen"></iframe>
            </div>

            <div class="terminal-status">
                <div id="now-playing">[ SINAL PRONTO // SELECIONE UMA EMISSORA ]</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="> BUSCAR CANAL..." onkeyup="filterChannels()">
            </div>
            
            <div class="categories-bar">
                <button class="cat-btn active" onclick="changeCategory('all', this)">[TODOS]</button>
                <button class="cat-btn" onclick="changeCategory('tvaberta', this)">[TV ABERTA BR]</button>
                <button class="cat-btn" onclick="changeCategory('noticias', this)">[NOTÍCIAS]</button>
                <button class="cat-btn" onclick="changeCategory('filmes', this)">[FILMES/SÉRIES]</button>
                <button class="cat-btn" onclick="changeCategory('docs', this)">[DOCS/CIÊNCIA]</button>
                <button class="cat-btn" onclick="changeCategory('esportes', this)">[ESPORTES]</button>
                <button class="cat-btn" onclick="changeCategory('musica', this)">[MÚSICA]</button>
            </div>

            <div class="channel-list" id="channel-list"></div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // BASE DE DADOS HÍBRIDA (HLS + YOUTUBE LIVE)
        // type: 'hls' ou 'youtube'
        // Para YouTube: url é o ID do Canal ou link de Embed
        const canalDatabase = [
            // ================== TV ABERTA BR (YOUTUBE) ==================
            { name: "SBT (Ao Vivo)", type: "youtube", category: "tvaberta", country: "br", url: "https://www.youtube.com/embed/live_stream?channel=UCWWcsGzZ5tS9WESv4q2z2fw" },
            { name: "Record News", type: "youtube", category: "tvaberta", country: "br", url: "https://www.youtube.com/embed/live_stream?channel=UCuiLR4p6wQ3xLEm15pEn1Xw" },
            { name: "CNN Brasil", type: "youtube", category: "tvaberta", country: "br", url: "https://www.youtube.com/embed/live_stream?channel=UCVDcgzdquumUVDhVN2h0p1g" },
            { name: "Jovem Pan News", type: "youtube", category: "tvaberta", country: "br", url: "https://www.youtube.com/embed/live_stream?channel=UCzLQAcEyWME-K1x2X0i3Kzw" },
            { name: "Band News", type: "youtube", category: "tvaberta", country: "br", url: "https://www.youtube.com/embed/live_stream?channel=UCc-o2B3U9QvFz8t6_7w3hww" },
            
            // ================== TV ABERTA BR (HLS INSTITUCIONAL) ==================
            { name: "TV Câmara", type: "hls", category: "tvaberta", country: "br", url: "https://stream3.camara.gov.br/tv1/manifest.m3u8" },
            { name: "TV Justiça", type: "hls", category: "tvaberta", country: "br", url: "https://stream.tvjustica.jus.br/live/smil:tvjustica.smil/playlist.m3u8" },
            { name: "Canção Nova", type: "hls", category: "tvaberta", country: "br", url: "https://shls-cancao-nova-p.akamaized.net/out/v1/ee52378eb5944122822a9eb786a3d90f/index.m3u8" },
            { name: "Rede Século 21", type: "hls", category: "tvaberta", country: "br", url: "https://5a293674ed01f.streamlock.net/rs21/rs21.stream/playlist.m3u8" },
            { name: "Boa Vontade TV", type: "hls", category: "tvaberta", country: "br", url: "https://5a293674ed01f.streamlock.net/tvboa-vontade/tvboa-vontade.stream/playlist.m3u8" },
            
            // ================== NOTÍCIAS INTERNACIONAIS ==================
            { name: "Al Jazeera (EN)", type: "hls", category: "noticias", country: "intl", url: "https://live-hls-web-aje.getaj.net/AJE/01.m3u8" },
            { name: "TRT World (EN)", type: "hls", category: "noticias", country: "intl", url: "https://trtworld.akamaized.net/hls/live/2017092/trtworld/master.m3u8" },
            { name: "France 24 (EN)", type: "hls", category: "noticias", country: "intl", url: "https://france24-en-samsung.amagi.tv/playlist.m3u8" },
            { name: "Deutsche Welle (PT)", type: "hls", category: "noticias", country: "intl", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
            { name: "Euronews (EN)", type: "hls", category: "noticias", country: "intl", url: "https://euronews-euronews-express-1-us.samsung.amagi.tv/playlist.m3u8" },
            { name: "Sky News (Ao Vivo)", type: "youtube", category: "noticias", country: "intl", url: "https://www.youtube.com/embed/live_stream?channel=UCoMdktPbSTixAyNGWB-UYkQ" },
            { name: "Bloomberg Global", type: "youtube", category: "noticias", country: "intl", url: "https://www.youtube.com/embed/live_stream?channel=UCbxtaXWdrk-Z8O7pAiv_sYQ" },

            // ================== FILMES E SÉRIES 24H ==================
            { name: "Rakuten Action Movies", type: "hls", category: "filmes", country: "intl", url: "https://rakuten-actionmovies-1-eu.rakuten.wurl.tv/playlist.m3u8" },
            { name: "Rakuten Comedy", type: "hls", category: "filmes", country: "intl", url: "https://rakuten-comedy-1-eu.rakuten.wurl.tv/playlist.m3u8" },
            { name: "Dust (Sci-Fi)", type: "hls", category: "filmes", country: "intl", url: "https://dust-samsung-uk.amagi.tv/playlist.m3u8" },
            { name: "FilmRise Classic", type: "hls", category: "filmes", country: "intl", url: "https://filmrise-classic-tv-samsung-uk.amagi.tv/playlist.m3u8" },
            
            // ================== DOCS, CIÊNCIA & NATUREZA ==================
            { name: "NASA TV Public", type: "hls", category: "docs", country: "intl", url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-TV-Public/master.m3u8" },
            { name: "NatureVision TV", type: "hls", category: "docs", country: "intl", url: "https://naturevision-samsung-us.amagi.tv/playlist.m3u8" },
            { name: "ISS Live Now (Terra Visto do Espaço)", type: "youtube", category: "docs", country: "intl", url: "https://www.youtube.com/embed/live_stream?channel=UC438Rj7L-5JgU4N12wJ7eKw" },
            
            // ================== ESPORTES & AVENTURA ==================
            { name: "Red Bull TV", type: "hls", category: "esportes", country: "intl", url: "https://rbmn-live.akamaized.net/hls/live/591286/FL01/master.m3u8" },
            { name: "Fuel TV (Action Sports)", type: "hls", category: "esportes", country: "intl", url: "https://fueltv.amagi.tv/playlist.m3u8" },
            { name: "WPT (Poker)", type: "hls", category: "esportes", country: "intl", url: "https://worldpokertour-samsung-uk.amagi.tv/playlist.m3u8" },

            // ================== MÚSICA & RÁDIO ==================
            { name: "Lofi Girl (Beats 24/7)", type: "youtube", category: "musica", country: "intl", url: "https://www.youtube.com/embed/live_stream?channel=UCSJ4gkVC6NrvII8umztf0Ow" },
            { name: "Monstercat (EDM 24/7)", type: "youtube", category: "musica", country: "intl", url: "https://www.youtube.com/embed/live_stream?channel=UCJ6td3C9QlPO9O_J5dF4ZzA" },
            { name: "Qello Concerts", type: "hls", category: "musica", country: "intl", url: "https://qello-samsung-uk.amagi.tv/playlist.m3u8" }
        ];

        // Inicializa status
        canalDatabase.forEach(c => { 
            c.status = (c.type === 'youtube') ? 'yt' : undefined; 
        });

        let vjsPlayer;
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            vjsPlayer = videojs('vjs-player', {
                autoplay: false, controls: true, responsive: true, fluid: true
            });

            updateClock(); setInterval(updateClock, 1000);
            fetchWeather(); setInterval(fetchWeather, 600000);

            // Testa automaticamente os canais HLS ao carregar
            testHLSChannels();
            renderChannels();
        });

        function updateClock() {
            document.getElementById('clock-display').innerText = new Date().toLocaleTimeString('pt-BR');
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.6842&longitude=-53.8069&current_weather=true');
                const data = await res.json();
                if (data.current_weather) document.getElementById('temp-display').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            } catch (err) { document.getElementById('temp-display').innerText = '19°C'; }
        }

        // Testa apenas canais HLS. Canais YouTube recebem tag YT vermelha.
        async function testHLSChannels() {
            const hlsChannels = canalDatabase.filter(c => c.type === 'hls');
            for (const channel of hlsChannels) {
                try {
                    const res = await fetch(channel.url, { method: 'GET', signal: AbortSignal.timeout(4000) });
                    channel.status = res.ok ? 'ok' : 'fail';
                } catch (e) {
                    channel.status = 'fail';
                }
                renderChannels();
            }
        }

        function renderChannels() {
            const listContainer = document.getElementById('channel-list');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const activeName = listContainer.querySelector('.channel-item.active .channel-name span:nth-child(2)')?.textContent;
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => {
                const matchCategory = currentCategory === 'all' || c.category === currentCategory;
                const matchSearch = c.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            filtered.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                if (channel.name === activeName) div.classList.add('active');

                let badgeCountry = channel.country === 'br' ? 'badge-br' : 'badge-intl';
                let typeTxt = channel.type === 'youtube' ? 'YT' : 'HLS';
                
                const dotClass = channel.status === 'ok' ? 'ok'
                    : channel.status === 'yt' ? 'yt'
                    : channel.status === 'fail' ? 'fail'
                    : '';

                div.innerHTML = `
                    <span class="channel-name"><span class="status-dot ${dotClass}"></span><span>${channel.name}</span></span>
                    <span class="badge-group">
                        <span class="badge badge-type">${typeTxt}</span>
                        <span class="badge ${badgeCountry}">${channel.country.toUpperCase()}</span>
                    </span>
                `;
                div.onclick = () => playChannel(channel, div);
                listContainer.appendChild(div);
            });
        }

        function playChannel(channel, element) {
            document.getElementById('now-playing').innerText = `[ INICIANDO PROTOCOLO: // ${channel.name.toUpperCase()} ]`;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            const wrapperVjs = document.getElementById('video-wrapper');
            const playerYt = document.getElementById('yt-player');

            if (channel.type === 'youtube') {
                // Modo iFrame (YouTube)
                vjsPlayer.pause();
                wrapperVjs.style.display = 'none';
                playerYt.style.display = 'block';
                
                // Adiciona autoplay no link
                let ytUrl = channel.url;
                if(!ytUrl.includes('autoplay=1')) ytUrl += ytUrl.includes('?') ? '&autoplay=1' : '?autoplay=1';
                
                playerYt.src = ytUrl;
                document.getElementById('now-playing').innerText = `[ TRANSMISSÃO VIA SATÉLITE YT: // ${channel.name.toUpperCase()} ]`;
            } else {
                // Modo Nativo HLS
                playerYt.style.display = 'none';
                playerYt.src = '';
                wrapperVjs.style.display = 'block';
                
                vjsPlayer.reset();
                vjsPlayer.src({ src: channel.url, type: 'application/x-mpegURL' });
                vjsPlayer.play().then(() => {
                    document.getElementById('now-playing').innerText = `[ TRANSMITINDO SINAL HLS: // ${channel.name.toUpperCase()} ]`;
                }).catch(() => {
                    document.getElementById('now-playing').innerText = `[ CLIQUE NO PLAYER PARA INICIAR ]`;
                });
            }
        }

        function changeCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderChannels();
        }

        function filterChannels() { renderChannels(); }
    </script>
</body>
</html>
