<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ TERMINAL MAD MAX // BOLOTA TV ]</title>
    
    <!-- Video.js HLS Engine -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --hazard-orange: #ff5500;
            --terminal-green: #00ff66;
            --bg-dark: #070709;
            --panel-bg: #111217;
            --border-color: #2a1a08;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--terminal-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Efeito CRT Scanlines */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 6px 100%;
        }

        /* Top Bar Estilo Wasteland Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--hazard-orange);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.2);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--hazard-orange);
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sys-info {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            background: #000;
            padding: 6px 14px;
            border: 1px solid var(--hazard-orange);
            color: var(--hazard-orange);
        }

        .sys-info span { display: flex; align-items: center; gap: 6px; }

        /* Dashboard Container */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 15px;
            padding: 15px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 65px);
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Dual Player Wrapper (Suporta HLS e Youtube sem travar) */
        .screen-container {
            position: relative;
            width: 100%;
            height: 480px;
            background-color: #000;
            border: 2px solid var(--hazard-orange);
            box-shadow: inset 0 0 20px rgba(255, 85, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        #vjs-player, #yt-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .hidden { display: none !important; }

        .terminal-status {
            background-color: var(--panel-bg);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--hazard-orange);
        }

        #now-playing {
            font-size: 0.95rem;
            color: var(--terminal-green);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        /* Sidebar & Lista Estilo Terminal */
        .sidebar {
            background-color: var(--panel-bg);
            border: 1px solid var(--hazard-orange);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-container {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            background: #090a0d;
        }

        .search-container input {
            width: 100%;
            padding: 8px 12px;
            background: #000;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            font-family: inherit;
            outline: none;
        }

        .categories-bar {
            display: flex;
            gap: 5px;
            padding: 8px;
            background: #000;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .cat-btn {
            background: #15161c;
            border: 1px solid #333;
            color: #888;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--hazard-orange);
            color: #000;
            border-color: var(--hazard-orange);
            font-weight: bold;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-item {
            padding: 10px;
            background: #090a0d;
            border: 1px solid #1a1c24;
            color: #aaa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: all 0.15s ease;
        }

        .channel-item:hover {
            border-color: var(--terminal-green);
            color: var(--terminal-green);
            background: #11141a;
        }

        .channel-item.active {
            border-color: var(--hazard-orange);
            background: rgba(255, 85, 0, 0.15);
            color: var(--hazard-orange);
            font-weight: bold;
        }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border: 1px solid;
            text-transform: uppercase;
        }

        .badge-hls { border-color: var(--terminal-green); color: var(--terminal-green); }
        .badge-yt { border-color: #ff3333; color: #ff3333; }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
            .screen-container { height: 260px; }
            .sidebar { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <i class="fa-solid fa-biohazard"></i>
            <span>WAR-ROOM // BOLOTA TV v5.0</span>
        </div>
        <div class="sys-info">
            <span><i class="fa-solid fa-location-dot"></i> SANTA MARIA-RS</span>
            <span><i class="fa-solid fa-temperature-half"></i> <span id="temp-display">--°C</span></span>
            <span><i class="fa-solid fa-clock"></i> <span id="clock-display">00:00:00</span></span>
        </div>
    </header>

    <div class="main-container">
        <!-- Player Area -->
        <div class="player-section">
            <div class="screen-container">
                <!-- Engine 1: Video.js para m3u8 -->
                <video id="vjs-player" class="video-js vjs-default-skin" controls preload="auto"></video>
                <!-- Engine 2: Iframe para YouTube Direct -->
                <iframe id="yt-iframe" class="hidden" allowfullscreen allow="autoplay"></iframe>
            </div>

            <div class="terminal-status">
                <div id="now-playing">[ FREQUÊNCIA LIVRE // SELECIONE UM CANAL ]</div>
            </div>
        </div>

        <!-- Controls / Channels -->
        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="> FILTRAR CANAIS..." onkeyup="filterChannels()">
            </div>
            
            <div class="categories-bar">
                <button class="cat-btn active" onclick="changeCategory('all', this)">[TODOS]</button>
                <button class="cat-btn" onclick="changeCategory('m3u8', this)">[M3U8 HLS]</button>
                <button class="cat-btn" onclick="changeCategory('noticias', this)">[NOTÍCIAS]</button>
                <button class="cat-btn" onclick="changeCategory('filmes', this)">[FILMES/DEMO]</button>
                <button class="cat-btn" onclick="changeCategory('local', this)">[LOCAL RS]</button>
            </div>

            <div class="channel-list" id="channel-list"></div>
        </div>
    </div>

    <!-- Video.js Engine -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Banco de Dados Consolidado (M3U8 com CORS ativado + YouTube Direct Fallback)
        const canalDatabase = [
            // SINAIS M3U8 NATIVOS (HLS com CORS Testados)
            {
                name: "France 24 News (M3U8)",
                category: "noticias",
                engine: "hls",
                url: "https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8"
            },
            {
                name: "Deutsche Welle Live (M3U8)",
                category: "noticias",
                engine: "hls",
                url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8"
            },
            {
                name: "Tears of Steel 4K (M3U8)",
                category: "filmes",
                engine: "hls",
                url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8"
            },
            {
                name: "Big Buck Bunny (M3U8)",
                category: "filmes",
                engine: "hls",
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
            },
            {
                name: "Sintel Open Movie (M3U8)",
                category: "filmes",
                engine: "hls",
                url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
            },

            // SINAIS YOUTUBE (Com Fallback Iframe para evitar travamento CORS)
            {
                name: "Record News (Ao Vivo)",
                category: "noticias",
                engine: "youtube",
                url: "https://www.youtube.com/embed/live_stream?channel=UCuiLR4p6wQ3xLEm15pEn1Xw&autoplay=1"
            },
            {
                name: "Jovem Pan News (Ao Vivo)",
                category: "noticias",
                engine: "youtube",
                url: "https://www.youtube.com/embed/live_stream?channel=UC93p-68fC34y5mThv2I3e0g&autoplay=1"
            },
            {
                name: "Lofi Girl Radio 24/7",
                category: "filmes",
                engine: "youtube",
                url: "https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1"
            },
            {
                name: "TV Câmara Santa Maria (RS)",
                category: "local",
                engine: "youtube",
                url: "https://www.youtube.com/embed/live_stream?channel=UCqR53N2sUpwQZ9pPkW3O4Ew&autoplay=1"
            }
        ];

        let vjsPlayer;
        let currentCategory = 'all';

        // 1. Inicialização do Terminal
        document.addEventListener('DOMContentLoaded', () => {
            vjsPlayer = videojs('vjs-player');
            
            // Iniciar Relógio e Clima
            updateClock();
            setInterval(updateClock, 1000);
            fetchWeather();
            setInterval(fetchWeather, 600000); // Atualiza clima a cada 10 min

            renderChannels();
        });

        // 2. Relógio em Tempo Real
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toLocaleTimeString('pt-BR');
        }

        // 3. Clima de Santa Maria (RS) via API Open-Meteo Gratuita
        async function fetchWeather() {
            try {
                // Lat/Lon de Santa Maria - RS (-29.6842, -53.8069)
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.6842&longitude=-53.8069&current_weather=true');
                const data = await res.json();
                if(data.current_weather) {
                    document.getElementById('temp-display').innerText = `${Math.round(data.current_weather.temperature)}°C`;
                }
            } catch (err) {
                document.getElementById('temp-display').innerText = '19°C'; // Fallback
            }
        }

        // 4. Renderização e Filtros de Canais
        function renderChannels() {
            const listContainer = document.getElementById('channel-list');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => {
                const matchCategory = currentCategory === 'all' || 
                                     (currentCategory === 'm3u8' && c.engine === 'hls') ||
                                     c.category === currentCategory;
                const matchSearch = c.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="color:#666; padding:10px; font-size:0.8rem;">[SEM SINAL NESTA FREQUÊNCIA]</div>';
                return;
            }

            filtered.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `
                    <span>> ${channel.name}</span>
                    <span class="badge ${channel.engine === 'hls' ? 'badge-hls' : 'badge-yt'}">${channel.engine}</span>
                `;
                div.onclick = () => playChannel(channel, div);
                listContainer.appendChild(div);
            });
        }

        // 5. Alternância Inteligente de Engine (HLS vs YouTube)
        function playChannel(channel, element) {
            document.getElementById('now-playing').innerText = `[ CONECTADO: // ${channel.name.toUpperCase()} ]`;
            
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');

            const vjsEl = document.getElementById('vjs-player');
            const ytEl = document.getElementById('yt-iframe');

            if (channel.engine === 'hls') {
                // Ativa Video.js, Desativa Iframe
                ytEl.classList.add('hidden');
                ytEl.src = '';
                vjsEl.classList.remove('hidden');

                vjsPlayer.src({ src: channel.url, type: 'application/x-mpegURL' });
                vjsPlayer.play().catch(() => console.log('Aguardando clique para iniciar áudio/vídeo.'));
            } else {
                // Ativa Iframe, Desativa Video.js
                vjsPlayer.pause();
                vjsEl.classList.add('hidden');
                ytEl.classList.remove('hidden');
                ytEl.src = channel.url;
            }
        }

        function changeCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderChannels();
        }

        function filterChannels() {
            renderChannels();
        }
    </script>
</body>
</html>
