<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOLOTA TV // WASTELAND-NETWORK</title>
    <!-- CSS do Video.js para compatibilidade de streams HLS -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        :root {
            --neon-orange: #ff5500;
            --neon-amber: #ffaa00;
            --cyber-bg: #0a0806;
            --panel-bg: rgba(22, 16, 12, 0.85);
            --metal-border: #3a2a1a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--cyber-bg);
            color: #d1c2b4;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efeito CRT Scanlines estilo Mad Max High-Tech */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Menu Lateral Enferrujado e Tecnológico */
        #sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-right: 3px dashed var(--neon-orange);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 0 20px rgba(255, 85, 0, 0.15);
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin: 0 0 5px 0;
            color: var(--neon-orange);
            text-shadow: 0 0 10px var(--neon-orange);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .system-status {
            font-size: 0.75rem;
            color: var(--neon-amber);
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--metal-border);
            padding-bottom: 10px;
        }

        .category-title {
            font-size: 0.85rem;
            color: var(--neon-amber);
            text-transform: uppercase;
            margin: 15px 0 5px 0;
            letter-spacing: 1px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* Botões Estilo Sucata Futurista */
        .category-btn {
            background: #1c1510;
            color: #d1c2b4;
            border: 1px solid var(--metal-border);
            padding: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .category-btn:hover, .category-btn.active {
            background: var(--neon-orange);
            color: #000;
            box-shadow: 0 0 10px var(--neon-orange);
            border-color: var(--neon-orange);
            font-weight: bold;
        }

        /* Lista de Canais estilo Terminal Scrap-Yard */
        #channel-list {
            flex: 1;
            border: 1px solid var(--metal-border);
            background: rgba(10, 7, 5, 0.9);
            overflow-y: auto;
            padding: 5px;
        }

        /* Custom Scrollbar */
        #channel-list::-webkit-scrollbar { width: 6px; }
        #channel-list::-webkit-scrollbar-track { background: #120d0a; }
        #channel-list::-webkit-scrollbar-thumb { background: var(--metal-border); border-radius: 3px; }
        #channel-list::-webkit-scrollbar-thumb:hover { background: var(--neon-orange); }

        .channel-item {
            padding: 10px;
            margin: 4px 0;
            background: rgba(30, 22, 17, 0.4);
            border-left: 3px solid var(--metal-border);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.1s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-item:hover {
            background: rgba(255, 85, 0, 0.1);
            border-left-color: var(--neon-orange);
            color: #fff;
            padding-left: 15px;
        }

        /* Área do Player e Telas Radiais */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: radial-gradient(circle, #1a120b 0%, #0a0806 100%);
            position: relative;
        }

        #player-frame {
            width: 100%;
            max-width: 900px;
            background: #000;
            border: 4px solid var(--metal-border);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 40px rgba(255, 85, 0, 0.05);
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Cantoneiras high-tech mecânicas */
        #player-frame::before {
            content: ""; position: absolute; top: -4px; left: -4px; width: 20px; height: 20px; border-top: 4px solid var(--neon-orange); border-left: 4px solid var(--neon-orange);
        }
        #player-frame::after {
            content: ""; position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; border-bottom: 4px solid var(--neon-orange); border-right: 4px solid var(--neon-orange);
        }

        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        /* Estilização customizada do VideoJS */
        .video-js .vjs-big-play-button {
            background-color: rgba(255, 85, 0, 0.2) !important;
            border-color: var(--neon-orange) !important;
            color: var(--neon-orange) !important;
        }
        .video-js .vjs-control-bar {
            background-color: rgba(20, 15, 10, 0.9) !important;
            color: var(--neon-amber) !important;
        }
        .vjs-play-progress {
            background-color: var(--neon-orange) !important;
        }

        #now-playing {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--neon-amber);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral Apocalíptico -->
    <div id="sidebar">
        <h1>BOLOTA TV</h1>
        <div class="system-status">SYS_STATUS: ONLINE // FREQ_FINDER_v2.6</div>
        
        <div class="category-title">Filtrar Frequências:</div>
        <div class="category-grid">
            <button class="category-btn active" onclick="changeCategory('all', this)">Todos</button>
            <button class="category-btn" onclick="changeCategory('news', this)">Notícias</button>
            <button class="category-btn" onclick="changeCategory('movies', this)">Filmes/Mús</button>
            <button class="category-btn" onclick="changeCategory('edu', this)">Educação</button>
            <button class="category-btn" onclick="changeCategory('rs', this)">Local RS</button>
        </div>
        
        <div class="category-title">Canais Sintonizados:</div>
        <div id="channel-list">
            <!-- Canais serão injetados via JavaScript -->
        </div>
    </div>

    <!-- Container Central do Monitor Wasteland -->
    <div id="main-content">
        <div id="player-frame">
            <div id="player-container">
                <video id="bolota-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup='{}'>
                    <p class="vjs-no-js">Sinal corrompido. Ative o Javascript.</p>
                </video>
            </div>
        </div>
        <div id="now-playing">ESTAÇÃO ATUAL: NENHUMA SINTONIA SELECIONADA</div>
    </div>

    <!-- Scripts do Video.js para ler HLS (.m3u8) nativamente -->
    <script src="https://zencdn.net"></script>
    <script>
        const player = videojs('bolota-player');

        // Banco de canais públicos, testados e estáveis
        const canalDatabase = [
            { name: "TV Brasil HD", url: "https://rnp.br", category: "news" },
            { name: "Record News", url: "https://gofast.live", category: "news" },
            { name: "Canal Futura", url: "https://globo.com", category: "edu" },
            { name: "TV Cultura SP", url: "https://tvcultura.com.br", category: "edu" },
            { name: "TV Senado", url: "https://rnp.br", category: "news" },
            { name: "TV Câmara", url: "https://rnp.br", category: "news" },
            { name: "Sesc TV", url: "https://sesctv.org.br", category: "movies" },
            { name: "Pluto TV Anime", url: "https://pluto.tv", category: "movies" },
            { name: "TV Assembleia RS", url: "https://rnp.br", category: "rs" },
            { name: "TVE Rio Grande do Sul", url: "https://rnp.br", category: "rs" }
        ];

        // Inicializa renderizando todos os canais sintonizados
        renderChannels('all');

        function renderChannels(categoryFilter) {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => categoryFilter === 'all' || c.category === categoryFilter);

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="color:#777; padding:10px; font-size:0.8rem;">[NENHUM SINAL NESTA FREQUÊNCIA]</div>';
                return;
            }

            filtered.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `&gt; ${channel.name}`;
                div.onclick = () => playStation(channel.url, channel.name);
                listContainer.appendChild(div);
            });
        }

        function changeCategory(cat, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderChannels(cat);
        }

        function playStation(url, name) {
            document.getElementById('now-playing').innerText = `CONECTADO: // ${name.toUpperCase()}`;
            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });
            player.play().catch(err => {
                console.log("Aguardando interação do usuário para reprodução inicial.");
            });
        }
    </script>
</body>
</html>
