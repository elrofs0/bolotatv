<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL MAD MAX // BOLOTA TV v14.0</title>
    <!-- Video.js para streaming HLS/M3U8 -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #050a05;
            --terminal-gray: #1a2e1a;
        }

        /* Efeito de monitor CRT antigo */
        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Scanlines simulando tubo de imagem */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        header {
            border: 2px solid var(--neon-green);
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            background: var(--terminal-gray);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        #main-container {
            display: flex;
            flex: 1;
            gap: 15px;
            height: calc(100% - 120px);
        }

        /* Menu Lateral de Canais */
        #sidebar {
            width: 320px;
            border: 2px solid var(--neon-green);
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.8);
        }

        .filter-bar {
            padding: 5px;
            border-bottom: 2px solid var(--neon-green);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: var(--terminal-gray);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: inherit;
            padding: 3px 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--neon-green);
            color: black;
            font-weight: bold;
        }

        #lista-canais {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        /* Custom Scrollbar */
        #lista-canais::-webkit-scrollbar { width: 8px; }
        #lista-canais::-webkit-scrollbar-track { background: var(--dark-bg); }
        #lista-canais::-webkit-scrollbar-thumb { background: var(--neon-green); }

        .canal-item {
            padding: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .canal-item:hover, .canal-item.playing {
            background: rgba(57, 255, 20, 0.2);
            border: 1px solid var(--neon-green);
        }

        /* Área do Player Central */
        #content-area {
            flex: 1;
            border: 2px solid var(--neon-green);
            position: relative;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mensagem de Erro / Sinal Indisponível */
        #screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .alert-box {
            border: 3px dashed #ff3333;
            padding: 30px;
            color: #ff3333;
            background: rgba(255, 0, 0, 0.05);
            max-width: 500px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        .btn-retry {
            margin-top: 20px;
            background: #ff3333;
            color: black;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-retry:hover { background: #ff6666; }

        /* Ajustes do Player de Vídeo */
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div>[ TERMINAL MAD MAX // BOLOTA TV v14.0 M3U-ONLY ]</div>
        <div>SANTA MARIA-RS // <span id="clock">00:00:00</span></div>
    </header>

    <div id="main-container">
        
        <div id="sidebar">
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filtrar('TODOS')">[TODOS]</button>
                <button class="filter-btn" onclick="filtrar('TV ABERTA')">[TV ABERTA/GERAL BR]</button>
                <button class="filter-btn" onclick="filtrar('NOTICIAS')">[NOTÍCIAS]</button>
                <button class="filter-btn" onclick="filtrar('FILMES')">[FILMES/SÉRIES]</button>
                <button class="filter-btn" onclick="filtrar('DOCUMENTARIOS')">[DOCS/ESPORTES]</button>
            </div>
            <div id="lista-canais">
                <!-- Preenchido dinamicamente via JS -->
            </div>
        </div>

        <div id="content-area">
            
            <div id="screen-overlay" class="hidden">
                <div class="alert-box">
                    <h2>## SINAL INDISPONÍVEL ##</h2>
                    <p>ESTE CANAL NÃO RESPONDEU. É COMUM EM LISTAS PÚBLICAS — SERVIDORES CAEM E VOLTAM O TEMPO DO TODO. TENTE NOVAMENTE OU ESCOLHA OUTRO CANAL NA LISTA.</p>
                    <button class="btn-retry" onclick="tentarNovamente()">TENTAR DE NOVO</button>
                </div>
            </div>

            <video id="tv-player" class="video-js vjs-default-skin" controls preload="auto"></video>
            
        </div>
    </div>

    <script>
        let bancoCanais = [];
        let canalAtualUrl = "";
        const player = videojs('tv-player');
        const overlay = document.getElementById('screen-overlay');

        // Relógio digital
        setInterval(() => {
            const agora = new Date();
            document.getElementById('clock').innerText = agora.toLocaleTimeString('pt-BR');
        }, 1000);

        // REQUISIÇÃO DO JSON: Busca os dados de canais.json
        fetch('canais.json')
            .then(response => {
                if (!response.ok) throw new Error("Erro de rede");
                return response.json();
            })
            .then(data => {
                bancoCanais = data;
                carregarLista(bancoCanais);
            })
            .catch(err => {
                console.error("Erro ao carregar o arquivo JSON:", err);
                document.getElementById('lista-canais').innerHTML = "<div style='color:#ff3333; padding:10px;'>ERR: FALHA AO CARREGAR CANAIS.JSON</div>";
            });

        // Renderiza os canais na barra lateral
        function carregarLista(canais) {
            const listaContainer = document.getElementById('lista-canais');
            listaContainer.innerHTML = "";
            
            if (canais.length === 0) {
                listaContainer.innerHTML = "<div style='padding:10px;'>NENHUM CANAL CONFIGURADO</div>";
                return;
            }
            
            canais.forEach(canal => {
                const item = document.createElement('div');
                item.className = 'canal-item';
                const nomeCanal = (canal.nome || "SEM NOME").toUpperCase();
                const catCanal = (canal.categoria || "GERAL").toUpperCase();
                
                item.innerHTML = `<span>> ${nomeCanal}</span> <span>[${catCanal}]</span>`;
                item.onclick = () => sintonizar(canal.url, item);
                listaContainer.appendChild(item);
            });
        }

        // Dá play na stream
        function sintonizar(url, elementoHtml) {
            canalAtualUrl = url;
            overlay.classList.add('hidden');
            
            document.querySelectorAll('.canal-item').forEach(el => el.classList.remove('playing'));
            if(elementoHtml) elementoHtml.classList.add('playing');

            player.src({ type: 'application/x-mpegURL', src: url });
            player.play();
        }

        // Monitora falhas no sinal do vídeo
        player.on('error', function() {
            overlay.classList.remove('hidden');
        });

        function tentarNovamente() {
            if(canalAtualUrl) {
                sintonizar(canalAtualUrl, null);
            }
        }

        // Filtra os canais por categoria
        function filtrar(categoria) {
            document.querySelectorAll('.filter-bar .filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }

            if(categoria === 'TODOS') {
                carregarLista(bancoCanais);
            } else {
                const filtrados = bancoCanais.filter(c => c.categoria === categoria);
                carregarLista(filtrados);
            }
        }
    </script>
</body>
</html>
