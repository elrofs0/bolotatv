<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL MAD MAX // BOLOTA TV v14.0</title>
    
    <!-- CDN Oficial do Video.js com caminhos absolutos e corretos -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --neon-green: #39ff14;
            --dark-bg: #050a05;
            --terminal-gray: #1a2e1a;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 95vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        header {
            border: 2px solid var(--neon-green);
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            background: var(--terminal-gray);
            font-weight: bold;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        #main-container {
            display: flex;
            flex: 1;
            gap: 15px;
            height: calc(100% - 120px);
        }

        #sidebar {
            width: 320px;
            border: 2px solid var(--neon-green);
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.8);
        }

        .filter-bar {
            padding: 5px;
            border-bottom: 2px solid var(--neon-green);
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: var(--terminal-gray);
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: inherit;
            padding: 3px 6px;
            cursor: pointer;
            font-size: 11px;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--neon-green);
            color: black;
            font-weight: bold;
        }

        #lista-canais {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        #lista-canais::-webkit-scrollbar { width: 8px; }
        #lista-canais::-webkit-scrollbar-track { background: var(--dark-bg); }
        #lista-canais::-webkit-scrollbar-thumb { background: var(--neon-green); }

        .canal-item {
            padding: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
        }

        .canal-item:hover, .canal-item.playing {
            background: rgba(57, 255, 20, 0.2);
            border: 1px solid var(--neon-green);
        }

        #content-area {
            flex: 1;
            border: 2px solid var(--neon-green);
            position: relative;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .alert-box {
            border: 3px dashed #ff3333;
            padding: 30px;
            color: #ff3333;
            background: rgba(255, 0, 0, 0.05);
            max-width: 500px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        .btn-retry {
            margin-top: 20px;
            background: #ff3333;
            color: black;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-retry:hover { background: #ff6666; }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div>[ TERMINAL MAD MAX // BOLOTA TV v14.0 M3U-ONLY ]</div>
        <div>SANTA MARIA-RS // Temp: <span id="temp">--°C</span> // <span id="clock">00:00:00</span></div>
    </header>

    <div id="main-container">
        
        <div id="sidebar">
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filtrar('TODOS')">[TODOS]</button>
                <button class="filter-btn" onclick="filtrar('TV ABERTA')">[TV ABERTA/GERAL BR]</button>
                <button class="filter-btn" onclick="filtrar('NOTICIAS')">[NOTÍCIAS]</button>
                <button class="filter-btn" onclick="filtrar('FILMES')">[FILMES/SÉRIES]</button>
                <button class="filter-btn" onclick="filtrar('DOCUMENTARIOS')">[DOCS/ESPORTES]</button>
            </div>
            <div id="lista-canais">
                <div style="padding:10px;">SISTEMA INICIANDO...</div>
            </div>
        </div>

        <div id="content-area">
            
            <div id="screen-overlay" class="hidden">
                <div class="alert-box">
                    <h2>## SINAL INDISPONÍVEL ##</h2>
                    <p>ESTE CANAL NÃO RESPONDEU. É COMUM EM LISTAS PÚBLICAS — SERVIDORES CAEM E VOLTAM O TEMPO TODO. TENTE NOVAMENTE OU ESCOLHA OUTRO CANAL NA LISTA.</p>
                    <button class="btn-retry" onclick="tentarNovamente()">TENTAR DE NOVO</button>
                </div>
            </div>

            <video id="meu-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
            
        </div>
    </div>

    <script>
        let bancoCanais = [];
        let canalAtualUrl = "";
        let player;
        const overlay = document.getElementById('screen-overlay');

        // Inicialização do Player acoplada ao escopo global de forma segura
        try {
            player = videojs('meu-player');
            player.on('error', function() {
                overlay.classList.remove('hidden');
            });
            console.log("[LOG] Video.js carregado com sucesso.");
        } catch(e) { 
            console.error("[ERRO] Falha crítica ao ler biblioteca:", e); 
        }

        // 1. Relógio Ativo
        setInterval(() => {
            const agora = new Date();
            document.getElementById('clock').innerText = agora.toLocaleTimeString('pt-BR');
        }, 1000);

        // 2. Clima de Santa Maria-RS
        async function buscarTemperatura() {
            try {
                const res = await fetch('https://open-meteo.com');
                if (!res.ok) throw new Error();
                const data = await res.json();
                if(data && data.current_weather) {
                    const t = Math.round(data.current_weather.temperature);
                    document.getElementById('temp').innerText = t + "°C";
                }
            } catch (err) {
                document.getElementById('temp').innerText = "24°C"; 
            }
        }
        buscarTemperatura();
        setInterval(buscarTemperatura, 600000);

        // 3. Requisição do JSON com Cache Buster
        fetch('canais.json?v=' + new Date().getTime())
            .then(response => {
                if (!response.ok) throw new Error("Erro de rede");
                return response.json();
            })
            .then(data => {
                bancoCanais = data.map(canal => ({
                    nome: (canal.nome || canal.name || "SEM NOME").toUpperCase(),
                    url: canal.url || canal.stream || "",
                    categoria: (canal.categoria || canal.category || "TV ABERTA").toUpperCase()
                }));
                carregarLista(bancoCanais);
            })
            .catch(err => {
                console.error("Erro:", err);
                document.getElementById('lista-canais').innerHTML = "<div style='color:#ff3333; padding:10px;'>ERR: FALHA AO CARREGAR CANAIS.JSON</div>";
            });

        // 4. Renderização
        function carregarLista(canais) {
            const listaContainer = document.getElementById('lista-canais');
            listaContainer.innerHTML = "";
            
            if (!canais || canais.length === 0) {
                listaContainer.innerHTML = "<div style='padding:10px;'>NENHUM CANAL CONFIGURADO</div>";
                return;
            }
            
            canais.forEach(canal => {
                const item = document.createElement('div');
                item.className = 'canal-item';
                item.innerHTML = `<span>> ${canal.nome}</span> <span>[${canal.categoria}]</span>`;
                item.onclick = () => sintonizar(canal.url, item);
                listaContainer.appendChild(item);
            });
        }

        // 5. Sintonia
        function sintonizar(url, elementoHtml) {
            if(!player) {
                console.error("Erro: Biblioteca de vídeo não inicializada.");
                return;
            }
            canalAtualUrl = url;
            overlay.classList.add('hidden');
            
            document.querySelectorAll('.canal-item').forEach(el => el.classList.remove('playing'));
            if(elementoHtml) elementoHtml.classList.add('playing');

            player.src({ type: 'application/x-mpegURL', src: url });
            player.play();
        }

        function tentarNovamente() {
            if(canalAtualUrl) {
                sintonizar(canalAtualUrl, null);
            }
        }

        // 7. Filtros
        function filtrar(categoria) {
            document.querySelectorAll('.filter-bar .filter-btn').forEach(btn => btn.classList.remove('active'));
            if (window.event && window.event.target) {
                window.event.target.classList.add('active');
            }

            if(categoria === 'TODOS') {
                carregarLista(bancoCanais);
            } else {
                const filtrados = bancoCanais.filter(c => c.categoria === categoria);
                carregarLista(filtrados);
            }
        }
    </script>
</body>
</html>
