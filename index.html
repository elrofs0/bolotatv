<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ TERMINAL MAD MAX // BOLOTA TV v10.2 ]</title>
    
    <!-- Video.js Engine -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --hazard-orange: #ff5500;
            --terminal-green: #00ff66;
            --terminal-red: #ff3344;
            --terminal-grey: #666;
            --bg-dark: #070709;
            --panel-bg: #111217;
            --border-color: #2a1a08;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--terminal-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 3px, 6px 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--hazard-orange);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.25);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--hazard-orange);
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sys-info {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            background: #000;
            padding: 6px 14px;
            border: 1px solid var(--hazard-orange);
            color: var(--hazard-orange);
        }

        .sys-info span { display: flex; align-items: center; gap: 6px; }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 390px;
            gap: 15px;
            padding: 15px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 65px);
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 480px;
            background-color: #000;
            border: 2px solid var(--hazard-orange);
            box-shadow: inset 0 0 20px rgba(255, 85, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        #vjs-player {
            width: 100%;
            height: 100%;
        }

        .terminal-status {
            background-color: var(--panel-bg);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--hazard-orange);
        }

        #now-playing {
            font-size: 0.9rem;
            color: var(--terminal-green);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .sidebar {
            background-color: var(--panel-bg);
            border: 1px solid var(--hazard-orange);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-container {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            background: #090a0d;
        }

        .search-container input {
            width: 100%;
            padding: 8px 12px;
            background: #000;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            font-family: inherit;
            outline: none;
        }

        .categories-bar {
            display: flex;
            gap: 5px;
            padding: 8px;
            background: #000;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .cat-btn {
            background: #15161c;
            border: 1px solid #333;
            color: #888;
            padding: 5px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--hazard-orange);
            color: #000;
            border-color: var(--hazard-orange);
            font-weight: bold;
        }

        .diag-bar {
            padding: 8px;
            background: #000;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .diag-btn {
            background: #15161c;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 6px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
        }

        .diag-btn:hover { background: var(--terminal-green); color: #000; }
        .diag-btn:disabled { opacity: 0.5; cursor: wait; }

        .diag-summary {
            font-size: 0.7rem;
            color: #888;
            white-space: nowrap;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-item {
            padding: 10px;
            background: #090a0d;
            border: 1px solid #1a1c24;
            color: #aaa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            gap: 8px;
        }

        .channel-item:hover {
            border-color: var(--terminal-green);
            color: var(--terminal-green);
            background: #11141a;
        }

        .channel-item.active {
            border-color: var(--hazard-orange);
            background: rgba(255, 85, 0, 0.15);
            color: var(--hazard-orange);
            font-weight: bold;
        }

        .channel-name {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            min-width: 9px;
            border-radius: 50%;
            background: var(--terminal-grey);
            box-shadow: 0 0 4px rgba(0,0,0,0.6);
        }

        .status-dot.ok { background: var(--terminal-green); box-shadow: 0 0 6px var(--terminal-green); }
        .status-dot.fail { background: var(--terminal-red); box-shadow: 0 0 6px var(--terminal-red); }
        .status-dot.testing { background: var(--hazard-orange); animation: pulse 0.8s infinite; }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .status-reason {
            font-size: 0.65rem;
            color: var(--terminal-red);
            margin-left: 17px;
            margin-top: -2px;
        }

        .badge-group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border: 1px solid;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-br { border-color: #00ff66; color: #00ff66; }
        .badge-ar { border-color: #00ccff; color: #00ccff; }
        .badge-intl { border-color: #ffaa00; color: #ffaa00; }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
            .screen-container { height: 260px; }
            .sidebar { height: 480px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <i class="fa-solid fa-radio"></i>
            <span>WAR-ROOM // BOLOTA TV</span>
        </div>
        <div class="sys-info">
            <span><i class="fa-solid fa-location-dot"></i> SANTA MARIA-RS</span>
            <span><i class="fa-solid fa-temperature-half"></i> <span id="temp-display">--°C</span></span>
            <span><i class="fa-solid fa-clock"></i> <span id="clock-display">00:00:00</span></span>
        </div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="screen-container">
                <video id="vjs-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
            </div>

            <div class="terminal-status">
                <div id="now-playing">[ SINAL PRONTO // SELECIONE UMA EMISSORA ]</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="> BUSCAR CANAL..." onkeyup="filterChannels()">
            </div>

            <div class="diag-bar">
                <button class="diag-btn" id="diag-btn" onclick="testAllChannels()">[ ▶ TESTAR TODOS OS SINAIS ]</button>
                <span class="diag-summary" id="diag-summary"></span>
            </div>
            
            <div class="categories-bar">
                <button class="cat-btn active" onclick="changeCategory('all', this)">[TODOS]</button>
                <button class="cat-btn" onclick="changeCategory('br', this)">[BRASIL 🇧🇷]</button>
                <button class="cat-btn" onclick="changeCategory('ar', this)">[ARGENTINA 🇦🇷]</button>
                <button class="cat-btn" onclick="changeCategory('noticias', this)">[NOTÍCIAS]</button>
                <button class="cat-btn" onclick="changeCategory('cine', this)">[CINE 24H]</button>
            </div>

            <div class="channel-list" id="channel-list"></div>
        </div>
    </div>

    <!-- Script Video.js -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Proxy Cloudflare Ativo
        const PROXY_WORKER = 'https://bolota-tv-proxy.betaincensos.workers.dev/';
        const FALLBACK_PUBLIC_PROXY = 'https://corsproxy.io/?';

        const TEST_TIMEOUT_MS = 8000;
        const TEST_CONCURRENCY = 4;

        const DOMINIOS_SEM_PROXY = [
            'unified-streaming.com',
            'mux.dev',
            'akamaized.net'
        ];

        const canalDatabase = [
            // BRASIL
            { name: "TV Câmara (Federal)", category: "br", country: "br",
              url: "https://stream3.camara.gov.br/tv1/manifest.m3u8", ref: "https://www.camara.leg.br/" },
            { name: "TV Brasil (EBC)", category: "br", country: "br",
              url: "https://tvbrasil-stream.ebc.com.br/index.m3u8", ref: "https://tvbrasil.ebc.com.br/" },
            { name: "Rede Minas (Cultura)", category: "br", country: "br",
              url: "https://video01.icst.com.br/live/redeminas/playlist.m3u8", ref: "https://redeminas.tv/" },
            { name: "COM Brasil", category: "br", country: "br",
              url: "https://br5093.streamingdevideo.com.br/abc/abc/playlist.m3u8" },
            { name: "Amazon Sat (Norte)", category: "br", country: "br",
              url: "https://amazonsat.brasilstream.com.br/hls/amazonsat/index.m3u8" },
            { name: "ISTV Nacional", category: "br", country: "br",
              url: "https://video08.logicahost.com.br/istvnacional/srt.stream/istvnacional.m3u8" },
            { name: "Deutsche Welle (Português)", category: "noticias", country: "br",
              url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },

            // ARGENTINA
            { name: "Canal 26 (Buenos Aires)", category: "noticias", country: "ar",
              url: "https://stream-gtlc.telecentro.net.ar/hls/canal26hls/main.m3u8", ref: "https://www.canal26.com/" },
            { name: "TeleSUR (Latinoamérica)", category: "noticias", country: "ar",
              url: "https://tv.telesur.cdn.tda.as/hls/live.m3u8", ref: "https://www.telesurtv.net/" },
            { name: "TV Universidad (UNLP)", category: "ar", country: "ar",
              url: "https://stratus.stream.cespi.unlp.edu.ar/hls/tvunlp.m3u8", ref: "https://tv.unlp.edu.ar/" },
            { name: "TV Solidaria AR", category: "ar", country: "ar",
              url: "https://canadaremar2.todostreaming.es/live/argentina-web.m3u8" },

            // NOTÍCIAS INTERNACIONAIS
            { name: "France 24 (English)", category: "noticias", country: "intl",
              url: "https://static.france24.com/live/F24_EN_LO_HLS/live_tv.m3u8", ref: "https://www.france24.com/" },
            { name: "NHK World Japan (EN)", category: "noticias", country: "intl",
              url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },

            // CINE 24H & DEMO
            { name: "Tears of Steel 4K", category: "cine", country: "intl",
              url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" },
            { name: "Big Buck Bunny 24H", category: "cine", country: "intl",
              url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
        ];

        canalDatabase.forEach(c => { c.status = undefined; c.reason = ''; });

        let vjsPlayer;
        let currentCategory = 'all';

        function precisaDeProxy(channel) {
            // Se o canal necessita de Referer específico, obriga passar pelo Worker
            if (channel.ref) return true;
            return !DOMINIOS_SEM_PROXY.some(d => channel.url.includes(d));
        }

        function getPlayableUrl(channel) {
            if (!precisaDeProxy(channel)) return channel.url;
            
            if (PROXY_WORKER && PROXY_WORKER.trim() !== '') {
                const base = PROXY_WORKER.trim().endsWith('/') ? PROXY_WORKER.trim() : PROXY_WORKER.trim() + '/';
                let proxied = base + '?url=' + encodeURIComponent(channel.url);
                if (channel.ref) {
                    proxied += '&ref=' + encodeURIComponent(channel.ref);
                }
                return proxied;
            }
            return FALLBACK_PUBLIC_PROXY + encodeURIComponent(channel.url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            vjsPlayer = videojs('vjs-player', {
                autoplay: false,
                controls: true,
                responsive: true,
                fluid: true,
                html5: { vhs: { overrideNative: true } }
            });

            vjsPlayer.on('error', () => {
                const err = vjsPlayer.error();
                const code = err ? err.code : '?';
                const msg = err ? err.message : 'desconhecido';
                document.getElementById('now-playing').innerText =
                    `[ ERRO ${code}: ${msg.toUpperCase()} // SINAL PODE ESTAR OFFLINE ]`;
            });

            updateClock();
            setInterval(updateClock, 1000);
            fetchWeather();
            setInterval(fetchWeather, 600000);

            renderChannels();
        });

        function updateClock() {
            document.getElementById('clock-display').innerText = new Date().toLocaleTimeString('pt-BR');
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.6842&longitude=-53.8069&current_weather=true');
                const data = await res.json();
                if (data.current_weather) {
                    document.getElementById('temp-display').innerText = `${Math.round(data.current_weather.temperature)}°C`;
                }
            } catch (err) {
                document.getElementById('temp-display').innerText = '19°C';
            }
        }

        async function testChannel(channel) {
            channel.status = 'testing';
            channel.reason = '';
            renderChannels();

            try {
                const res = await fetch(getPlayableUrl(channel), {
                    method: 'GET',
                    signal: AbortSignal.timeout(TEST_TIMEOUT_MS)
                });

                if (!res.ok) {
                    channel.status = 'fail';
                    channel.reason = `HTTP ${res.status}`;
                    return;
                }

                const text = await res.text();
                if (!text.trim().includes('#EXTM3U')) {
                    channel.status = 'fail';
                    channel.reason = 'resposta não é HLS válido';
                    return;
                }

                channel.status = 'ok';
            } catch (e) {
                channel.status = 'fail';
                channel.reason = (e.name === 'TimeoutError' || e.name === 'AbortError')
                    ? `timeout (${TEST_TIMEOUT_MS / 1000}s)`
                    : 'erro de rede / CORS';
            }
        }

        async function testAllChannels() {
            const btn = document.getElementById('diag-btn');
            btn.disabled = true;
            btn.innerText = '[ TESTANDO... ]';

            const queue = [...canalDatabase];
            const workers = Array.from({ length: TEST_CONCURRENCY }, async () => {
                while (queue.length) {
                    const channel = queue.shift();
                    await testChannel(channel);
                    renderChannels();
                    updateDiagSummary();
                }
            });
            await Promise.all(workers);

            btn.disabled = false;
            btn.innerText = '[ ▶ TESTAR TODOS OS SINAIS ]';
            updateDiagSummary();
        }

        function updateDiagSummary() {
            const ok = canalDatabase.filter(c => c.status === 'ok').length;
            const fail = canalDatabase.filter(c => c.status === 'fail').length;
            const total = canalDatabase.length;
            document.getElementById('diag-summary').innerText =
                (ok + fail) > 0 ? `${ok}/${total} OK` : '';
        }

        function renderChannels() {
            const listContainer = document.getElementById('channel-list');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const activeName = listContainer.querySelector('.channel-item.active .channel-name span:nth-child(2)')?.textContent;
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => {
                const matchCategory = currentCategory === 'all' || c.category === currentCategory || c.country === currentCategory;
                const matchSearch = c.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="color:#666; padding:10px; font-size:0.8rem;">[SINAL NÃO LOCALIZADO]</div>';
                return;
            }

            filtered.forEach(channel => {
                const wrapper = document.createElement('div');

                const div = document.createElement('div');
                div.className = 'channel-item';
                if (channel.name === activeName) div.classList.add('active');

                let badgeClass = 'badge-intl';
                if (channel.country === 'br') badgeClass = 'badge-br';
                if (channel.country === 'ar') badgeClass = 'badge-ar';

                const dotClass = channel.status === 'ok' ? 'ok'
                    : channel.status === 'fail' ? 'fail'
                    : channel.status === 'testing' ? 'testing'
                    : '';

                div.innerHTML = `
                    <span class="channel-name"><span class="status-dot ${dotClass}"></span><span>${channel.name}</span></span>
                    <span class="badge-group"><span class="badge ${badgeClass}">${channel.country.toUpperCase()}</span></span>
                `;
                div.onclick = () => playChannel(channel, div);
                wrapper.appendChild(div);

                if (channel.status === 'fail' && channel.reason) {
                    const reasonEl = document.createElement('div');
                    reasonEl.className = 'status-reason';
                    reasonEl.innerText = `↳ ${channel.reason}`;
                    wrapper.appendChild(reasonEl);
                }

                listContainer.appendChild(wrapper);
            });
        }

        function playChannel(channel, element) {
            document.getElementById('now-playing').innerText = `[ CONECTANDO: // ${channel.name.toUpperCase()} ]`;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            vjsPlayer.reset();
            vjsPlayer.src({ src: getPlayableUrl(channel), type: 'application/x-mpegURL' });

            vjsPlayer.play().then(() => {
                document.getElementById('now-playing').innerText = `[ TRANSMITINDO: // ${channel.name.toUpperCase()} ]`;
            }).catch(() => {
                console.log('Interação do usuário necessária para reprodução.');
            });
        }

        function changeCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderChannels();
        }

        function filterChannels() {
            renderChannels();
        }
    </script>
</body>
</html>
