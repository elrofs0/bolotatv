<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolota Tv</title>
    <meta name="referrer" content="no-referrer-when-downgrade">
    <style>
        :root {
            --bg-color: #050505;
            --sidebar-bg: rgba(15, 15, 20, 0.95);
            --text-color: #ffffff;
            --card-hover: rgba(255, 255, 255, 0.08);
            --fav-color: #f1c40f;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: var(--bg-color);
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .sidebar { width: 320px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: transform 0.3s ease; z-index: 1000; }
        .sidebar-header { padding: 25px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.2)); border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .sidebar-header h1 { font-size: 1.8rem; color: var(--text-color); margin-bottom: 15px; font-weight: 800; text-shadow: 2px 2px 4px #000; letter-spacing: 1.5px;}
        .sidebar-header h1 span { color: #00a8ff; }
        
        .search-box { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; outline: none; transition: border 0.2s;}
        .search-box:focus { border-color: #00a8ff; box-shadow: 0 0 8px rgba(0, 168, 255, 0.3); }

        .info-widget { padding: 12px 20px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; color: #ccc; border-bottom: 1px solid rgba(255,255,255,0.05);}
        
        .channel-list { flex: 1; overflow-y: auto; padding: 15px 10px; }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .category-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.2px; color: #00a8ff; margin: 20px 0 10px 10px; font-weight: bold;}
        
        .channel-item { width: 100%; padding: 12px 15px; background: transparent; border: 1px solid transparent; color: #eaeaea; font-size: 0.95rem; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; margin-bottom: 4px; }
        .channel-item:hover { background-color: var(--card-hover); transform: translateX(4px); }
        .channel-item.active { background-color: rgba(0, 168, 255, 0.15); color: #fff; border: 1px solid rgba(0, 168, 255, 0.3); font-weight: bold; }
        .channel-name { flex: 1; text-align: left; }
        
        .fav-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #444; transition: color 0.2s, transform 0.2s; padding-left: 10px; }
        .fav-btn.favorited { color: var(--fav-color); text-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }
        .fav-btn:hover { transform: scale(1.1); }

        .main-content { flex: 1; display: flex; flex-direction: column; background-color: #000; position: relative; }
        .menu-toggle { display: none; position: absolute; top: 15px; left: 15px; background: rgba(0, 168, 255, 0.8); border: none; color: white; padding: 10px 15px; border-radius: 6px; cursor: pointer; z-index: 2000; font-size: 1rem; backdrop-filter: blur(5px); }

        .player-wrapper { flex: 1; position: relative; width: 100%; background: #000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .player-wrapper.mini-mode { position: fixed; bottom: 25px; right: 25px; width: 400px; height: 225px; z-index: 9999; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); flex: none; }

        .player-footer { padding: 15px 25px; background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8)); display: flex; justify-content: space-between; align-items: center; z-index: 10; border-top: 1px solid rgba(255,255,255,0.05);}
        .channel-info p { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .channel-info h2 { font-size: 1.3rem; font-weight: 500; }
        
        .controls { display: flex; gap: 15px; align-items: center; }
        .pip-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .pip-btn:hover { background: rgba(255,255,255,0.2); }

        @media (max-width: 900px) {
            .menu-toggle { display: block; }
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); box-shadow: 10px 0 20px rgba(0,0,0,0.7); }
            .sidebar.open { transform: translateX(0); }
            .player-wrapper { height: 35vh; flex: none; margin-top: 55px;}
            .main-content { justify-content: flex-start; }
            .player-footer { flex-direction: column; align-items: flex-start; gap: 15px; }
            .player-wrapper.mini-mode { width: 280px; height: 157px; bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleMenu()">☰ Canais</button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>Bolota <span>Tv</span></h1>
            <input type="text" id="search" class="search-box" placeholder="Buscar canal ou assunto..." onkeyup="filterChannels()">
        </div>
        
        <div class="info-widget">
            <span id="local-time">--:--:--</span>
            <span id="local-weather">Buscando Clima...</span>
        </div>

        <div class="channel-list" id="channelList"></div>
    </div>

    <div class="main-content" onclick="closeMenuOnVideoClick()">
        <div class="player-wrapper" id="playerWrapper">
            <iframe id="yt-player" 
                    src="https://www.youtube-nocookie.com/embed/gCNeDWCI0vo?autoplay=1&mute=1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
        <div class="player-footer">
            <div class="channel-info">
                <p>Sintonizado Agora</p>
                <h2 id="current-channel">Record News Ao Vivo</h2>
            </div>
            <div class="controls">
                <button class="pip-btn" onclick="toggleMiniPlayer()">🔳 Modo Mini-Player (PIP)</button>
            </div>
        </div>
    </div>

    <script>
        const channelsData = [
            // TV Aberta & Notícias
            { id: 'gCNeDWCI0vo', name: 'Record News Ao Vivo', category: 'TV Aberta & Notícias' },
            { id: '21X5lGlDOfg', name: 'NASA TV Ao Vivo', category: 'TV Aberta & Notícias' },
            
            // Música & Entretenimento
            { id: 'w4cTYnOPdNk', name: 'Stray Kids - MANIAC (Ao Vivo)', category: 'Música & Entretenimento' },
            { id: 'dBD90g1sU3M', name: 'Stray Kids - S-Class (Ao Vivo)', category: 'Música & Entretenimento' },
            { id: 'jfKfPfyJRdk', name: 'Lofi Girl (Música para Estudar)', category: 'Música & Entretenimento' },

            // Filosofia & Oculto
            { id: '7n_ZfM-XW9M', name: 'O Caibalion (Audiolivro)', category: 'Filosofia & Oculto' },
            { id: 'R31Q4Vyl2D0', name: 'Aristóteles: Ética a Nicômaco', category: 'Filosofia & Oculto' },
            { id: 'hV_1d-9Q8d8', name: 'Platão: A República', category: 'Filosofia & Oculto' },

            // Ciência & Tecnologia
            { id: 'W9S_V9XW0z0', name: 'Física Quântica Documentário', category: 'Ciência & Tecnologia' },
            { id: 'rfscVS0vtbw', name: 'Lógica de Programação', category: 'Ciência & Tecnologia' }
        ];

        let favorites = JSON.parse(localStorage.getItem('bolota_tv_favs_v5')) || [];
        let currentActiveId = 'gCNeDWCI0vo';

        function renderChannels() {
            const listElement = document.getElementById('channelList');
            listElement.innerHTML = '';
            
            if (favorites.length > 0) {
                listElement.innerHTML += `<div class="category-title">⭐ Favoritos</div>`;
                channelsData.forEach((ch, idx) => {
                    if (favorites.includes(ch.id)) {
                        listElement.innerHTML += createChannelHTML(ch, idx, true);
                    }
                });
            }

            const categories = [...new Set(channelsData.map(ch => ch.category))];
            categories.forEach(category => {
                listElement.innerHTML += `<div class="category-title">📺 ${category}</div>`;
                channelsData.forEach((ch, idx) => {
                    if (ch.category === category) {
                        listElement.innerHTML += createChannelHTML(ch, idx, favorites.includes(ch.id));
                    }
                });
            });
        }

        function createChannelHTML(channel, index, isFav) {
            const activeClass = (channel.id === currentActiveId) ? 'active' : '';
            const favClass = isFav ? 'favorited' : '';
            return `
                <div class="channel-item ${activeClass}">
                    <div class="channel-name" onclick="playChannelByIndex(${index})">${channel.name}</div>
                    <button class="fav-btn ${favClass}" onclick="toggleFavorite('${channel.id}', event)">★</button>
                </div>
            `;
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
            localStorage.setItem('bolota_tv_favs_v5', JSON.stringify(favorites));
            renderChannels();
        }

        function playChannelByIndex(index) {
            const ch = channelsData[index];
            if (!ch) return;
            
            currentActiveId = ch.id;
            const player = document.getElementById('yt-player');
            const originHost = window.location.origin;
            
            player.src = `https://www.youtube-nocookie.com/embed/${ch.id}?autoplay=1&origin=${encodeURIComponent(originHost)}`;
            document.getElementById('current-channel').innerText = ch.name;
            renderChannels(); 

            if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open');
        }

        function toggleMiniPlayer() { document.getElementById('playerWrapper').classList.toggle('mini-mode'); }
        function filterChannels() {
            const query = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.channel-item').forEach(item => {
                const text = item.querySelector('.channel-name').textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function closeMenuOnVideoClick() { if (window.innerWidth <= 900) document.getElementById('sidebar').classList.remove('open'); }

        function updateClock() {
            document.getElementById('local-time').innerText = new Date().toLocaleTimeString('pt-BR');
        }
        setInterval(updateClock, 1000); updateClock();

        async function fetchWeather(lat, lon) {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await response.json();
                if(data?.current_weather) {
                    document.getElementById('local-weather').innerText = `${Math.round(data.current_weather.temperature)}°C 🌤️`;
                }
            } catch { document.getElementById('local-weather').innerText = "--°C"; }
        }

        function getLocationAndWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
                    err => fetchWeather(-29.6842, -53.8069)
                );
            } else fetchWeather(-29.6842, -53.8069);
        }
        getLocationAndWeather(); setInterval(getLocationAndWeather, 1800000);

        renderChannels();
    </script>
</body>
</html>
