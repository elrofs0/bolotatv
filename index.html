<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bolota TV - Web Player</title>
  <style>
    :root {
      --bg-color: #0f0f13;
      --card-bg: #1a1a24;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --live-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #14141c;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d2d3d;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo span {
      color: var(--text);
    }

    .search-box {
      width: 300px;
      max-width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #374151;
      background: #1e1e2d;
      color: white;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      padding: 20px;
      flex: 1;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Player Area */
    .player-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .iframe-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .player-info {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .channel-title {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-yt {
      background: #cc181e;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-yt:hover {
      background: #e62117;
    }

    /* Sidebar / Playlist */
    .sidebar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab {
      background: #272738;
      color: var(--text-muted);
      border: none;
      padding: 6px 12px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--accent);
      color: white;
    }

    .channel-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #232332;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .channel-item:hover {
      background: #2e2e42;
    }

    .channel-item.active {
      border-left: 4px solid var(--accent);
      background: #2c2940;
    }

    .channel-meta {
      display: flex;
      flex-direction: column;
    }

    .channel-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .channel-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .badge-live {
      background: var(--live-red);
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-edu {
      background: #059669;
      color: white;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid #2d2d3d;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      📺 <span>Bolota TV</span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Pesquisar canal..." onkeyup="filterChannels()">
    </div>
  </header>

  <main>
    <!-- Player Principal -->
    <section class="player-container">
      <div class="iframe-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      </div>
      <div class="player-info">
        <div>
          <h2 id="activeTitle" class="channel-title">Carregando...</h2>
          <span id="activeCat" style="color: var(--text-muted); font-size: 0.85rem;"></span>
        </div>
        <div class="actions">
          <a id="ytLink" href="#" target="_blank" class="btn-yt">🔗 Abrir no YouTube</a>
        </div>
      </div>
    </section>

    <!-- Sidebar de Canais -->
    <aside class="sidebar">
      <div class="filter-tabs">
        <button class="tab active" onclick="filterCategory('all', this)">Todos</button>
        <button class="tab" onclick="filterCategory('Ao Vivo', this)">Ao Vivo</button>
        <button class="tab" onclick="filterCategory('Santa Maria', this)">Santa Maria</button>
        <button class="tab" onclick="filterCategory('Educação', this)">Educação</button>
      </div>
      
      <ul class="channel-list" id="channelList">
        <!-- Gerado via JavaScript -->
      </ul>
    </aside>
  </main>

  <footer>
    Bolota TV &copy; 2026 - Central de Programação e Transmissões Ao Vivo
  </footer>

  <script>
    const channels = [
      {
        id: "logica",
        name: "Lógica de Programação",
        category: "Educação",
        badge: "Curso",
        badgeType: "edu",
        embedUrl: "https://www.youtube.com/embed/8mei6E_I-28?autoplay=1",
        ytUrl: "https://www.youtube.com/watch?v=8mei6E_I-28"
      },
      {
        id: "bandnews",
        name: "BandNews TV / Band",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCv6n26iJp2a60M-k29Jm9jQ",
        ytUrl: "https://www.youtube.com/@bandjornalismo/live"
      },
      {
        id: "jovempan",
        name: "Jovem Pan News",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCP391YRAjSOdM_bwievgaZA",
        ytUrl: "https://www.youtube.com/@jovempannews/live"
      },
      {
        id: "tvsenado",
        name: "TV Senado",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCLgti7NuK0RuW9wty-fxPjQ",
        ytUrl: "https://www.youtube.com/@tvsenado/live"
      },
      {
        id: "camarasanta",
        name: "TV Câmara Santa Maria (RS)",
        category: "Santa Maria",
        badge: "Local",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCd0s2W_hYv6U1G7m8eY_k5A",
        ytUrl: "https://www.youtube.com/@TVC%C3%A2maraSantaMaria/streams"
      },
      {
        id: "tvufsm",
        name: "TV Campus UFSM (Santa Maria)",
        category: "Santa Maria",
        badge: "Local",
        badgeType: "edu",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UC5mZ5lK91s1gT7qL3h0VvAw",
        ytUrl: "https://www.youtube.com/@tvcampusufsm"
      },
      {
        id: "tvcamara",
        name: "TV Câmara Federal",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UC9mSr_hZ2i7_N6k1vP_Kksw",
        ytUrl: "https://www.youtube.com/@camaradosdeputadosoficial/live"
      },
      {
        id: "cnnbr",
        name: "CNN Brasil",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCvdwhh_fDyWccR42-rReSiA",
        ytUrl: "https://www.youtube.com/@CNNBrasil/live"
      },
      {
        id: "recordnews",
        name: "Record News",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UCv6o8bE-Hn_kZ6eF07qQ-lA",
        ytUrl: "https://www.youtube.com/@RecordNews/live"
      },
      {
        id: "tvbrasil",
        name: "TV Brasil (EBC)",
        category: "Ao Vivo",
        badge: "AO VIVO",
        badgeType: "live",
        embedUrl: "https://www.youtube.com/embed/live_stream?channel=UC8xYlVv-d3cO3fVq2f_e7yA",
        ytUrl: "https://www.youtube.com/@tvbrasil/live"
      }
    ];

    let currentCategory = 'all';

    function renderChannels() {
      const listEl = document.getElementById('channelList');
      listEl.innerHTML = '';

      const query = document.getElementById('searchInput').value.toLowerCase();

      channels.forEach(ch => {
        const matchesCat = currentCategory === 'all' || ch.category === currentCategory;
        const matchesSearch = ch.name.toLowerCase().includes(query) || ch.category.toLowerCase().includes(query);

        if (matchesCat && matchesSearch) {
          const li = document.createElement('li');
          li.className = 'channel-item';
          li.onclick = () => selectChannel(ch);

          li.innerHTML = `
            <div class="channel-meta">
              <span class="channel-name">${ch.name}</span>
              <span class="channel-cat">${ch.category}</span>
            </div>
            <span class="${ch.badgeType === 'live' ? 'badge-live' : 'badge-edu'}">${ch.badge}</span>
          `;
          listEl.appendChild(li);
        }
      });
    }

    function selectChannel(ch) {
      document.getElementById('videoPlayer').src = ch.embedUrl;
      document.getElementById('activeTitle').innerText = ch.name;
      document.getElementById('activeCat').innerText = ch.category;
      document.getElementById('ytLink').href = ch.ytUrl;

      // Destacar canal selecionado
      const items = document.querySelectorAll('.channel-item');
      items.forEach(item => {
        if (item.querySelector('.channel-name').innerText === ch.name) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderChannels();
    }

    function filterChannels() {
      renderChannels();
    }

    // Inicialização
    window.onload = () => {
      renderChannels();
      // Inicia por padrão com o primeiro canal
      if (channels.length > 0) {
        selectChannel(channels[0]);
      }
    };
  </script>
</body>
</html>
