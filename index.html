<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player IPTV - Teste HLS</title>
    <!-- CSS do Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .player-box { flex: 2; min-width: 300px; }
        .sidebar { flex: 1; min-width: 250px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        #now-playing { margin-bottom: 10px; font-weight: bold; color: #00ffcc; }
        .channel-item { padding: 10px; background: #2a2a2a; margin-bottom: 8px; cursor: pointer; border-radius: 4px; }
        .channel-item:hover, .channel-item.active { background: #00ffcc; color: #000; }
        .video-js { width: 100%; height: 400px; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="now-playing">SELECIONE UM CANAL</div>

    <div class="container">
        <div class="player-box">
            <video id="my-player" class="video-js vjs-default-skin" controls preload="auto" crossorigin="anonymous">
                <p class="vjs-no-js">Para ver este vídeo, habilite o JavaScript.</p>
            </video>
        </div>

        <div class="sidebar">
            <div id="channel-list"></div>
        </div>
    </div>

    <!-- JS do Video.js -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Transmissões de teste públicas com CORS liberado
        const canalDatabase = [
            { 
                name: "Tears of Steel (HLS Teste)", 
                category: "filmes", 
                url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" 
            },
            { 
                name: "Apple HLS Test Stream", 
                category: "variados", 
                url: "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8" 
            },
            { 
                name: "Akamai Live Test", 
                category: "variados", 
                url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8" 
            }
        ];

        let player;

        // Inicializa o player após o carregamento da DOM
        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('my-player', {
                html5: {
                    vhs: { overrideNative: true }
                }
            });
            renderChannels('all');
        });

        function renderChannels(categoryFilter = 'all') {
            const listContainer = document.getElementById('channel-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => categoryFilter === 'all' || c.category === categoryFilter);

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="color:#777;">[NENHUM SINAL NESTA FREQUÊNCIA]</div>';
                return;
            }

            filtered.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerText = `> ${channel.name}`;
                div.onclick = () => playStation(channel.url, channel.name, div);
                listContainer.appendChild(div);
            });
        }

        function playStation(url, name, element) {
            const display = document.getElementById('now-playing');
            if (display) display.innerText = `CONECTADO: // ${name.toUpperCase()}`;

            document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            // Atualiza a fonte e força a reprodução
            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });

            player.play().catch(err => {
                console.warn("Autoplay bloqueado pelo navegador ou erro de CORS no link:", err);
            });
        }
    </script>
</body>
</html>
