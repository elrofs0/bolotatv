<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolota TV - Web Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #14161d;
            border-bottom: 1px solid #222531;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
        }

        .logo i {
            color: #e50914;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 15px 8px 38px;
            border-radius: 20px;
            border: 1px solid #2a2e3d;
            background-color: #1c1f2b;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        /* Container Principal */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 70px);
        }

        /* Player */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .channel-info {
            background-color: #14161d;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #222531;
        }

        .channel-info h2 {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .channel-info p {
            font-size: 0.85rem;
            color: #a0a6b8;
        }

        /* Sidebar / Lista de Canais */
        .sidebar {
            background-color: #14161d;
            border-radius: 12px;
            border: 1px solid #222531;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        /* Categorias (Scroll Horizontal Limpo) */
        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid #222531;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }

        .categories-bar::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .category-btn {
            background-color: #1c1f2b;
            border: 1px solid #2a2e3d;
            color: #a0a6b8;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .category-btn:hover, .category-btn.active {
            background-color: #6366f1;
            color: #ffffff;
            border-color: #6366f1;
        }

        /* Lista de Canais (Scroll Vertical Escuro) */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Scrollbar customizada escura */
        .channel-list::-webkit-scrollbar {
            width: 6px;
        }
        .channel-list::-webkit-scrollbar-track {
            background: #14161d;
        }
        .channel-list::-webkit-scrollbar-thumb {
            background: #2a2e3d;
            border-radius: 4px;
        }
        .channel-list::-webkit-scrollbar-thumb:hover {
            background: #3f4457;
        }

        /* Card de Canal */
        .channel-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background-color: #1c1f2b;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-card:hover {
            background-color: #242838;
            border-color: #3f4457;
        }

        .channel-card.active {
            border-color: #6366f1;
            background-color: rgba(99, 102, 241, 0.15);
        }

        .channel-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-category {
            font-size: 0.75rem;
            color: #a0a6b8;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag-live { background-color: #e50914; color: #fff; }
        .tag-local { background-color: #2563eb; color: #fff; }
        .tag-course { background-color: #10b981; color: #fff; }
        .tag-movie { background-color: #8b5cf6; color: #fff; }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .sidebar {
                height: 500px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-tv"></i>
            <span>Bolota TV</span>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar canal ou categoria..." onkeyup="filterChannels()">
        </div>
    </header>

    <div class="main-container">
        <!-- Player -->
        <div class="player-section">
            <div class="iframe-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="channel-info">
                <h2 id="currentTitle">Carregando...</h2>
                <p id="currentDesc">Selecione um canal na lista ao lado.</p>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="categories-bar">
                <button class="category-btn active" onclick="filterCategory('todos', this)">Todos</button>
                <button class="category-btn" onclick="filterCategory('noticias', this)">Notícias</button>
                <button class="category-btn" onclick="filterCategory('filmes', this)">Filmes & Séries</button>
                <button class="category-btn" onclick="filterCategory('educacao', this)">Educação</button>
                <button class="category-btn" onclick="filterCategory('local', this)">Local RS</button>
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>
    </div>

    <script>
        const channels = [
            // Educação & Programação (Vídeo testado e funcionando)
            {
                id: "rfscVS0vtbw",
                name: "Lógica de Programação (Curso Completo)",
                category: "educacao",
                desc: "Curso completo de algoritmos e lógica de programação - Curso em Vídeo.",
                tag: "Curso",
                tagClass: "tag-course"
            },
            {
                id: "21X5lGlDOfg",
                name: "NASA TV - Transmissão do Espaço",
                category: "educacao",
                desc: "Visão da Terra ao vivo diretamente da Estação Espacial Internacional (ISS).",
                tag: "Ao Vivo",
                tagClass: "tag-live"
            },
            // Notícias
            {
                id: "gCNeDWCI010",
                name: "Jovem Pan News",
                category: "noticias",
                desc: "Jornalismo ao vivo, coberturas e análises em tempo real.",
                tag: "Ao Vivo",
                tagClass: "tag-live"
            },
            {
                id: "vBq4k8i7k3g",
                name: "BandNews TV",
                category: "noticias",
                desc: "Transmissão 24 horas de notícias do Brasil e do mundo.",
                tag: "Ao Vivo",
                tagClass: "tag-live"
            },
            {
                id: "S3_P0A8eE9M",
                name: "Record News",
                category: "noticias",
                desc: "Canal de jornalismo da Rede Record com notícias atualizadas.",
                tag: "Ao Vivo",
                tagClass: "tag-live"
            },
            {
                id: "9A2g4zY3jL0",
                name: "TV Senado",
                category: "noticias",
                desc: "Transmissões ao vivo do Congresso Nacional e decisões políticas.",
                tag: "Ao Vivo",
                tagClass: "tag-live"
            },
            // Filmes e Entretenimento
            {
                id: "PL23C7D4E755106198", // Playlist NetMovies
                isPlaylist: true,
                name: "NetMovies - Filmes Dublados",
                category: "filmes",
                desc: "Sessão contínua com filmes completos e licenciados em português.",
                tag: "Filmes",
                tagClass: "tag-movie"
            },
            {
                id: "jfKfPfyJRdk",
                name: "Lofi Girl - Relax & Focus Radio",
                category: "filmes",
                desc: "Música 24/7 para concentração, estudos e programação.",
                tag: "Ao Vivo",
                tagClass: "tag-live"
            },
            // Locais (Santa Maria - RS)
            {
                id: "videoseries?list=PL3eWnO2EwX92k3P8L3", // ID de Exemplo / Canal Institucional
                name: "TV Cámara Santa Maria (RS)",
                category: "local",
                desc: "Sessões e transmissões oficiais da Câmara Municipal de SM.",
                tag: "Local RS",
                tagClass: "tag-local"
            },
            {
                id: "videoseries?list=PLR1j0s0P8H90J1s3",
                name: "TV Campus UFSM",
                category: "local",
                desc: "Conteúdos acadêmicos e jornalísticos da Universidade Federal de SM.",
                tag: "Local RS",
                tagClass: "tag-local"
            }
        ];

        let selectedCategory = 'todos';

        function renderChannels(filterText = '') {
            const listElement = document.getElementById('channelList');
            listElement.innerHTML = '';

            const filtered = channels.filter(ch => {
                const matchesCategory = selectedCategory === 'todos' || ch.category === selectedCategory;
                const matchesSearch = ch.name.toLowerCase().includes(filterText.toLowerCase()) || 
                                      ch.desc.toLowerCase().includes(filterText.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            filtered.forEach((ch, index) => {
                const card = document.createElement('div');
                card.className = `channel-card ${index === 0 ? '' : ''}`;
                card.onclick = () => playChannel(ch, card);

                card.innerHTML = `
                    <div class="channel-details">
                        <span class="channel-name">${ch.name}</span>
                        <span class="channel-category">${getCategoryLabel(ch.category)}</span>
                    </div>
                    <span class="tag ${ch.tagClass}">${ch.tag}</span>
                `;
                listElement.appendChild(card);
            });

            // Auto-seleciona o primeiro da lista se o player estiver vazio
            if (filtered.length > 0 && !document.getElementById('videoPlayer').src) {
                playChannel(filtered[0], listElement.firstElementChild);
            }
        }

        function playChannel(ch, element) {
            const player = document.getElementById('videoPlayer');
            
            // Configura URL do embed dependendo se é vídeo único, live ou playlist
            let embedUrl = ch.isPlaylist 
                ? `https://www.youtube.com/embed/videoseries?list=${ch.id}&autoplay=1`
                : `https://www.youtube.com/embed/${ch.id}?autoplay=1&rel=0`;

            player.src = embedUrl;
            document.getElementById('currentTitle').innerText = ch.name;
            document.getElementById('currentDesc').innerText = ch.desc;

            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        function filterCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChannels(document.getElementById('searchInput').value);
        }

        function filterChannels() {
            renderChannels(document.getElementById('searchInput').value);
        }

        function getCategoryLabel(cat) {
            const labels = {
                noticias: 'TV Aberta & Notícias',
                filmes: 'Entretenimento & Filmes',
                educacao: 'Educação & Ciência',
                local: 'Santa Maria - RS'
            };
            return labels[cat] || 'Geral';
        }

        // Inicialização
        renderChannels();
    </script>
</body>
</html>
