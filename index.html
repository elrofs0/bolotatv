<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ TERMINAL MAD MAX // BOLOTA TV v10.9 ]</title>
    
    <!-- Video.js Engine -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --hazard-orange: #ff5500;
            --terminal-green: #00ff66;
            --terminal-red: #ff3344;
            --terminal-grey: #666;
            --bg-dark: #070709;
            --panel-bg: #111217;
            --border-color: #2a1a08;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--terminal-green);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 0, 0.05));
            background-size: 100% 3px, 6px 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--hazard-orange);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.25);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--hazard-orange);
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .sys-info {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            background: #000;
            padding: 6px 14px;
            border: 1px solid var(--hazard-orange);
            color: var(--hazard-orange);
        }

        .sys-info span { display: flex; align-items: center; gap: 6px; }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 390px;
            gap: 15px;
            padding: 15px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 65px);
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 480px;
            background-color: #000;
            border: 2px solid var(--hazard-orange);
            box-shadow: inset 0 0 20px rgba(255, 85, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }

        #vjs-player {
            width: 100%;
            height: 100%;
        }

        .terminal-status {
            background-color: var(--panel-bg);
            padding: 12px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--hazard-orange);
        }

        #now-playing {
            font-size: 0.9rem;
            color: var(--terminal-green);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .sidebar {
            background-color: var(--panel-bg);
            border: 1px solid var(--hazard-orange);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .search-container {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            background: #090a0d;
        }

        .search-container input {
            width: 100%;
            padding: 8px 12px;
            background: #000;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            font-family: inherit;
            outline: none;
        }

        .categories-bar {
            display: flex;
            gap: 5px;
            padding: 8px;
            background: #000;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .cat-btn {
            background: #15161c;
            border: 1px solid #333;
            color: #888;
            padding: 5px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--hazard-orange);
            color: #000;
            border-color: var(--hazard-orange);
            font-weight: bold;
        }

        .diag-bar {
            padding: 8px;
            background: #000;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .diag-btn {
            background: #15161c;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 6px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: inherit;
            flex: 1;
        }

        .diag-btn:hover { background: var(--terminal-green); color: #000; }
        .diag-btn:disabled { opacity: 0.5; cursor: wait; }

        .diag-summary {
            font-size: 0.7rem;
            color: #888;
            white-space: nowrap;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .channel-item {
            padding: 10px;
            background: #090a0d;
            border: 1px solid #1a1c24;
            color: #aaa;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            gap: 8px;
        }

        .channel-item:hover {
            border-color: var(--terminal-green);
            color: var(--terminal-green);
            background: #11141a;
        }

        .channel-item.active {
            border-color: var(--hazard-orange);
            background: rgba(255, 85, 0, 0.15);
            color: var(--hazard-orange);
            font-weight: bold;
        }

        .channel-name {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            min-width: 9px;
            border-radius: 50%;
            background: var(--terminal-grey);
            box-shadow: 0 0 4px rgba(0,0,0,0.6);
        }

        .status-dot.ok { background: var(--terminal-green); box-shadow: 0 0 6px var(--terminal-green); }
        .status-dot.fail { background: var(--terminal-red); box-shadow: 0 0 6px var(--terminal-red); }
        .status-dot.testing { background: var(--hazard-orange); animation: pulse 0.8s infinite; }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .badge-group { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

        .badge {
            font-size: 0.65rem;
            padding: 2px 6px;
            border: 1px solid;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-br { border-color: #00ff66; color: #00ff66; }
        .badge-intl { border-color: #ffaa00; color: #ffaa00; }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
            .screen-container { height: 260px; }
            .sidebar { height: 480px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <i class="fa-solid fa-radio"></i>
            <span>WAR-ROOM // BOLOTA TV</span>
        </div>
        <div class="sys-info">
            <span><i class="fa-solid fa-location-dot"></i> SANTA MARIA-RS</span>
            <span><i class="fa-solid fa-temperature-half"></i> <span id="temp-display">--°C</span></span>
            <span><i class="fa-solid fa-clock"></i> <span id="clock-display">00:00:00</span></span>
        </div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="screen-container">
                <video id="vjs-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>
            </div>

            <div class="terminal-status">
                <div id="now-playing">[ SINAL PRONTO // SELECIONE UMA EMISSORA ]</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="> BUSCAR CANAL..." onkeyup="filterChannels()">
            </div>

            <div class="diag-bar">
                <button class="diag-btn" id="diag-btn" onclick="testAllChannels()">[ ▶ TESTAR SINAIS ESTÁVEIS ]</button>
                <span class="diag-summary" id="diag-summary"></span>
            </div>
            
            <div class="categories-bar">
                <button class="cat-btn active" onclick="changeCategory('all', this)">[TODOS]</button>
                <button class="cat-btn" onclick="changeCategory('noticias', this)">[NOTÍCIAS]</button>
                <button class="cat-btn" onclick="changeCategory('cine', this)">[CINE 24H]</button>
            </div>

            <div class="channel-list" id="channel-list"></div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        const TEST_TIMEOUT_MS = 5000;

        // Lista enxuta apenas com canais com alta disponibilidade
        const canalDatabase = [
            { name: "TV Câmara (Federal)", category: "noticias", country: "br",
              url: "https://stream3.camara.gov.br/tv1/manifest.m3u8" },
            { name: "Deutsche Welle (PT)", category: "noticias", country: "br",
              url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
            { name: "France 24 (English)", category: "noticias", country: "intl",
              url: "https://france24-en-samsung.amagi.tv/playlist.m3u8" },
            { name: "NHK World Japan (EN)", category: "noticias", country: "intl",
              url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
            { name: "Euronews (English)", category: "noticias", country: "intl",
              url: "https://euronews-euronews-express-1-us.samsung.amagi.tv/playlist.m3u8" },
            { name: "Sintel Movie 24H", category: "cine", country: "intl",
              url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" },
            { name: "Tears of Steel 4K", category: "cine", country: "intl",
              url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" },
            { name: "Big Buck Bunny 24H", category: "cine", country: "intl",
              url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" }
        ];

        canalDatabase.forEach(c => { c.status = undefined; });

        let vjsPlayer;
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            vjsPlayer = videojs('vjs-player', {
                autoplay: false,
                controls: true,
                responsive: true,
                fluid: true
            });

            updateClock();
            setInterval(updateClock, 1000);
            fetchWeather();
            setInterval(fetchWeather, 600000);

            renderChannels();
        });

        function updateClock() {
            document.getElementById('clock-display').innerText = new Date().toLocaleTimeString('pt-BR');
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-29.6842&longitude=-53.8069&current_weather=true');
                const data = await res.json();
                if (data.current_weather) {
                    document.getElementById('temp-display').innerText = `${Math.round(data.current_weather.temperature)}°C`;
                }
            } catch (err) {
                document.getElementById('temp-display').innerText = '19°C';
            }
        }

        async function testChannel(channel) {
            channel.status = 'testing';
            renderChannels();

            try {
                const res = await fetch(channel.url, { method: 'GET', signal: AbortSignal.timeout(TEST_TIMEOUT_MS) });
                if (res.ok) {
                    channel.status = 'ok';
                    return;
                }
            } catch (e) {}

            channel.status = 'fail';
        }

        async function testAllChannels() {
            const btn = document.getElementById('diag-btn');
            btn.disabled = true;
            btn.innerText = '[ TESTANDO... ]';

            for (const channel of canalDatabase) {
                await testChannel(channel);
                renderChannels();
                updateDiagSummary();
            }

            btn.disabled = false;
            btn.innerText = '[ ▶ TESTAR SINAIS ESTÁVEIS ]';
            updateDiagSummary();
        }

        function updateDiagSummary() {
            const ok = canalDatabase.filter(c => c.status === 'ok').length;
            const total = canalDatabase.length;
            document.getElementById('diag-summary').innerText = `${ok}/${total} OK`;
        }

        function renderChannels() {
            const listContainer = document.getElementById('channel-list');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const activeName = listContainer.querySelector('.channel-item.active .channel-name span:nth-child(2)')?.textContent;
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => {
                const matchCategory = currentCategory === 'all' || c.category === currentCategory;
                const matchSearch = c.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            filtered.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                if (channel.name === activeName) div.classList.add('active');

                let badgeClass = channel.country === 'br' ? 'badge-br' : 'badge-intl';

                const dotClass = channel.status === 'ok' ? 'ok'
                    : channel.status === 'fail' ? 'fail'
                    : channel.status === 'testing' ? 'testing'
                    : '';

                div.innerHTML = `
                    <span class="channel-name"><span class="status-dot ${dotClass}"></span><span>${channel.name}</span></span>
                    <span class="badge-group"><span class="badge ${badgeClass}">${channel.country.toUpperCase()}</span></span>
                `;
                div.onclick = () => playChannel(channel, div);
                listContainer.appendChild(div);
            });
        }

        function playChannel(channel, element) {
            document.getElementById('now-playing').innerText = `[ TRANSMITINDO: // ${channel.name.toUpperCase()} ]`;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            vjsPlayer.reset();
            vjsPlayer.src({ src: channel.url, type: 'application/x-mpegURL' });
            vjsPlayer.play().catch(() => {
                document.getElementById('now-playing').innerText = `[ CLIQUE NO PLAYER PARA INICIAR ]`;
            });
        }

        function changeCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderChannels();
        }

        function filterChannels() {
            renderChannels();
        }
    </script>
</body>
</html>
