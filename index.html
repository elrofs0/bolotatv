<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolota TV - Web Player</title>
    
    <!-- Video.js e Plugins -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #14161d;
            border-bottom: 1px solid #222531;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
        }

        .logo i { color: #00ffcc; }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 15px 8px 38px;
            border-radius: 20px;
            border: 1px solid #2a2e3d;
            background-color: #1c1f2b;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 75px);
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-wrapper {
            width: 100%;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #222531;
        }

        .video-js {
            width: 100%;
            height: 480px;
        }

        .channel-info {
            background-color: #14161d;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #222531;
        }

        #now-playing {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
        }

        .sidebar {
            background-color: #14161d;
            border-radius: 12px;
            border: 1px solid #222531;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid #222531;
            overflow-x: auto;
        }

        .category-btn {
            background-color: #1c1f2b;
            border: 1px solid #2a2e3d;
            color: #a0a6b8;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .category-btn:hover, .category-btn.active {
            background-color: #00ffcc;
            color: #000;
            border-color: #00ffcc;
            font-weight: bold;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: #1c1f2b;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:hover {
            background-color: #242838;
            border-color: #3f4457;
        }

        .channel-item.active {
            border-color: #00ffcc;
            background-color: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            background: #2a2e3d;
            color: #fff;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .video-js { height: 260px; }
            .sidebar { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-satellite-dish"></i>
            <span>Bolota TV</span>
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar canal..." onkeyup="filterChannels()">
        </div>
    </header>

    <div class="main-container">
        <div class="player-section">
            <div class="video-wrapper">
                <video id="my-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                    <p class="vjs-no-js">Para visualizar este vídeo, habilite o JavaScript.</p>
                </video>
            </div>

            <div class="channel-info">
                <div id="now-playing">STATUS: // SELECIONE UM CANAL</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="categories-bar">
                <button class="category-btn active" onclick="changeCategory('all', this)">Todos</button>
                <button class="category-btn" onclick="changeCategory('noticias', this)">Notícias</button>
                <button class="category-btn" onclick="changeCategory('filmes', this)">Filmes & Demo</button>
                <button class="category-btn" onclick="changeCategory('educacao', this)">Educação</button>
                <button class="category-btn" onclick="changeCategory('local', this)">Local RS</button>
            </div>
            <div class="channel-list" id="channel-list"></div>
        </div>
    </div>

    <!-- Scripts Video.js e Youtube Tech -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Youtube.min.js"></script>

    <script>
        const canalDatabase = [
            // Canais HLS Direct Streams (.m3u8)
            {
                name: "Tears of Steel (HLS Demo)",
                category: "filmes",
                url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8",
                type: "application/x-mpegURL"
            },
            {
                name: "Akamai Live Test Stream",
                category: "noticias",
                url: "https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8",
                type: "application/x-mpegURL"
            },
            {
                name: "Big Buck Bunny (HLS Stream)",
                category: "filmes",
                url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
                type: "application/x-mpegURL"
            },
            {
                name: "Apple BipBop (Test Signal)",
                category: "filmes",
                url: "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8",
                type: "application/x-mpegURL"
            },

            // Transmissões via Youtube Integration
            {
                name: "Record News (Ao Vivo)",
                category: "noticias",
                url: "https://www.youtube.com/watch?v=live_stream?channel=UCuiLR4p6wQ3xLEm15pEn1Xw",
                type: "video/youtube"
            },
            {
                name: "Lofi Girl - Relax & Focus",
                category: "filmes",
                url: "https://www.youtube.com/watch?v=jfKfPfyJRdk",
                type: "video/youtube"
            },
            {
                name: "Lógica de Programação - Guanabara",
                category: "educacao",
                url: "https://www.youtube.com/watch?v=8mei6uVttho",
                type: "video/youtube"
            },
            {
                name: "Curso de Python - Guanabara",
                category: "educacao",
                url: "https://www.youtube.com/watch?v=S9uPNppGsGo",
                type: "video/youtube"
            },
            {
                name: "TV Câmara Santa Maria (RS)",
                category: "local",
                url: "https://www.youtube.com/watch?v=live_stream?channel=UCqR53N2sUpwQZ9pPkW3O4Ew",
                type: "video/youtube"
            }
        ];

        let player;
        let currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('my-player', {
                techOrder: ['html5', 'youtube'],
                autoplay: false,
                controls: true,
                responsive: true
            });

            renderChannels();
        });

        function renderChannels(categoryFilter = currentCategory) {
            currentCategory = categoryFilter;
            const listContainer = document.getElementById('channel-list');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            if (!listContainer) return;
            listContainer.innerHTML = '';

            const filtered = canalDatabase.filter(c => {
                const matchCategory = currentCategory === 'all' || c.category === currentCategory;
                const matchSearch = c.name.toLowerCase().includes(searchVal);
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div style="color:#777; padding:15px; font-size:0.85rem; text-align:center;">[NENHUM SINAL ENCONTRADO]</div>';
                return;
            }

            filtered.forEach(channel => {
                const div = document.createElement('div');
                div.className = 'channel-item';
                div.innerHTML = `
                    <span>> ${channel.name}</span>
                    <span class="tag">${channel.type.includes('mpegURL') ? 'HLS' : 'YT'}</span>
                `;
                div.onclick = () => playStation(channel.url, channel.name, channel.type, div);
                listContainer.appendChild(div);
            });
        }

        function changeCategory(cat, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            renderChannels(cat);
        }

        function filterChannels() {
            renderChannels(currentCategory);
        }

        function playStation(url, name, type, element) {
            const display = document.getElementById('now-playing');
            if (display) display.innerText = `CONECTADO: // ${name.toUpperCase()}`;

            document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            player.src({
                src: url,
                type: type
            });

            player.play().catch(err => {
                console.log("Aguardando ação do usuário para reprodução inicial.");
            });
        }
    </script>
</body>
</html>
