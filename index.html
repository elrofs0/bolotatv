<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolota TV - Web Player</title>
    <!-- Adicionando o CSS do Video.js para garantir a reprodução estável de .m3u8 (HLS) -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 250px; background: #1e1e1e; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        h1 { margin-top: 0; color: #00ff88; }
        .category-btn { display: block; width: 100%; padding: 10px; margin: 5px 0; background: #333; color: #fff; border: none; text-align: left; cursor: pointer; border-radius: 4px; }
        .category-btn:hover { background: #00ff88; color: #000; }
        #player-container { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; }
        .video-js { width: 100% !important; height: 100% !important; }
        #channel-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .channel-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #333; }
        .channel-item:hover { background: #444; }
    </style>
</head>
<body>

    <!-- Menu Lateral -->
    <div id="sidebar">
        <h1>Bolota TV</h1>
        <p>Selecione uma categoria:</p>
        <button class="category-btn" onclick="loadCategory('news')">Todos Notícias</button>
        <button class="category-btn" onclick="loadCategory('movies')">Filmes & Música</button>
        <button class="category-btn" onclick="loadCategory('education')">Educação</button>
        <button class="category-btn" onclick="loadCategory('local-rs')">Local RS</button>
        
        <!-- Lista de canais carregados da categoria -->
        <div id="channel-list"></div>
    </div>

    <!-- Área do Player -->
    <div id="main-content">
        <div id="player-container">
            <video id="bolota-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup='{}'>
                <p class="vjs-no-js">Para ver este vídeo, ative o JavaScript ou atualize o navegador.</p>
            </video>
        </div>
    </div>

    <!-- Scripts do Video.js para rodar os formatos de streaming de IPTV (.m3u8) -->
    <script src="https://zencdn.net"></script>
    <script>
        const player = videojs('bolota-player');

        // Mapeamento dos links brutos (RAW) das fontes oficiais que não bloqueiam exibição externa
        const playlists = {
            'news': 'https://iptv-org.github.io/iptv/categories/news.m3u',
            'movies': 'https://github.io',
            'education': 'https://github.io',
            // Usando o repositório focado em canais abertos do Brasil para a categoria local
            'local-rs': 'https://githubusercontent.com'
        };

        // Função para buscar o arquivo M3U e processar os canais
        async function loadCategory(categoryKey) {
            const listContainer = document.getElementById('channel-list');
            listContainer.innerHTML = 'Carregando canais...';
            
            try {
                const response = await fetch(playlists[categoryKey]);
                const data = await response.text();
                const channels = parseM3U(data);
                
                listContainer.innerHTML = '';
                
                if(channels.length === 0) {
                    listContainer.innerHTML = 'Nenhum canal encontrado.';
                    return;
                }

                // Renderiza os primeiros 30 canais para evitar lentidão no navegador
                channels.slice(0, 30).forEach(channel => {
                    const div = document.createElement('div');
                    div.className = 'channel-item';
                    div.innerText = channel.name;
                    div.onclick = () => playStream(channel.url);
                    listContainer.appendChild(div);
                });
            } catch (error) {
                listContainer.innerHTML = 'Erro ao carregar os canais desta categoria.';
                console.error(error);
            }
        }

        // Parser simples de arquivos de playlist M3U
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentName = '';

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    // Extrai o nome do canal após a última vírgula
                    const parts = line.split(',');
                    currentName = parts[parts.length - 1] || 'Canal Sem Nome';
                } else if (line.startsWith('http')) {
                    channels.push({ name: currentName, url: line });
                }
            }
            return channels;
        }

        // Altera a fonte do player e inicia a transmissão do canal selecionado
        function playStream(url) {
            player.src({
                src: url,
                type: 'application/x-mpegURL' // Define o tipo correto para arquivos .m3u8
            });
            player.play();
        }
    </script>
</body>
</html>
